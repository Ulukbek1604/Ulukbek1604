<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Касса — ключ</title>
<style>
  /*
   * Окно ключа нарочно не похоже на кассу: это не работа, а разовая
   * настройка. Шрифты системные — окно открывается до интернета.
   */
  :root { color-scheme: light dark; --ink: #16191a; --dim: #6a706c; --line: #d8dad6;
          --bg: #f2f3f0; --card: #fff; --brand: #2f6fb5; --red: #b3202b; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8ebe6; --dim: #9aa29c; --line: #2a3138; --bg: #0e1620; --card: #141c26;
            --brand: #4a8ccc; --red: #e06b74; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  .card { width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--line);
          border-radius: 14px; padding: 26px; }
  h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: -.015em; }
  p { color: var(--dim); margin: 0 0 18px; }
  .label { font-size: 12.5px; color: var(--dim); margin-bottom: 6px; }
  .print { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
  .print code { flex: 1; font: 600 20px/1 ui-monospace, Consolas, monospace; letter-spacing: .06em;
                background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
                padding: 13px 14px; user-select: all; }
  input { width: 100%; font: 600 18px/1 ui-monospace, Consolas, monospace; letter-spacing: .06em;
          color: var(--ink); background: var(--bg); border: 1px solid var(--line);
          border-radius: 10px; padding: 13px 14px; text-transform: uppercase; }
  input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  button { font: 600 15px system-ui, sans-serif; border-radius: 10px; padding: 12px 16px;
           border: 1px solid var(--line); background: var(--card); color: var(--ink);
           cursor: pointer; }
  button.go { width: 100%; margin-top: 14px; background: var(--brand); border-color: var(--brand);
              color: #fff; }
  button:hover { filter: brightness(1.06); }
  .bad { color: var(--red); font-weight: 600; margin: 12px 0 0; min-height: 21px; }
  .foot { margin: 20px 0 0; font-size: 12.5px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Ключ программы</h1>
    <p>Касса работает на одном компьютере. Продиктуйте код этого компьютера тому, кто поставил программу, и введите ключ, который он назовёт.</p>

    <div class="label">Код этого компьютера</div>
    <div class="print">
      <code id="print">…</code>
      <button id="copy" type="button">Скопировать</button>
    </div>

    <div class="label">Ключ</div>
    <input id="key" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" autofocus autocomplete="off" spellcheck="false">
    <button class="go" id="go" type="button">Открыть кассу</button>
    <p class="bad" id="bad"></p>
    <p class="foot" id="foot"></p>
  </div>

<script>
  const print = window.ключ.отпечаток();
  document.getElementById('print').textContent = print;
  document.getElementById('foot').textContent = 'Без ключа касса не откроется. Данные при этом никуда не денутся.';

  document.getElementById('copy').addEventListener('click', () => {
    navigator.clipboard?.writeText(print);
    document.getElementById('copy').textContent = 'Скопировано';
    setTimeout(() => { document.getElementById('copy').textContent = 'Скопировать'; }, 1500);
  });

  function попытка() {
    const ok = window.ключ.проверить(document.getElementById('key').value);
    if (!ok) {
      document.getElementById('bad').textContent = 'Ключ не подходит к этому компьютеру.';
      return;
    }
    // Уходим на кассу сами: так переход случается, когда окно свободно,
    // а не посреди ответа на запрос.
    document.getElementById('bad').textContent = '';
    location.href = 'kassa.html';
  }

  document.getElementById('go').addEventListener('click', попытка);
  document.getElementById('key').addEventListener('keydown', (e) => { if (e.key === 'Enter') попытка(); });
</script>
</body>
</html>
