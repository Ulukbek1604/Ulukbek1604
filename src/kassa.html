      <label class="fld"><span>Наценка, %</span>
        <input id="ng-markup" type="number" inputmode="numeric" value="${esc(ng.markup)}"></label>
    </div>
    ${ng.bad === 'cost' ? '<p class="q2" style="color:var(--red);margin:-6px 0 10px">Нужна цена, по которой пришло.</p>' : ''}

    <label class="fld"><span>Продаём по, сом</span>
      <input id="ng-price" type="number" inputmode="numeric" value="${esc(ng.price)}" placeholder="считается от наценки"></label>
    <p class="q2">Наценка и цена связаны: меняете одно — пересчитывается другое.</p>
    ${ng.bad === 'price' ? '<p class="q2" style="color:var(--red);margin:-6px 0 10px">Нужна цена продажи.</p>' : ''}

/**
 * Название собирается из частей, пустые пропускаются.
 *
 * Оперативная и постоянная сливаются в привычное «8/256 ГБ»: так пишут
 * на ценниках и так спрашивают покупатели. Если известна только одна,
 * пишем её отдельно — «8 ГБ ОЗУ» или «256 ГБ».
 */
function ngName() {
  const ram = String(ng.ram).trim();
  const mem = String(ng.mem).trim();
  const память = ram && mem ? `${ram}/${mem}` : ram ? `${ram} ГБ ОЗУ` : mem;
  return [ng.model, память, ng.color].map((s) => String(s).trim()).filter(Boolean).join(' ');
}

/** Снять набранное из полей в черновик — перед любой перерисовкой листа. */
function ngRead() {
  if (!ng) return;
  for (const [key, id] of [['model', 'ng-model'], ['ram', 'ng-ram'], ['mem', 'ng-mem'],
                           ['color', 'ng-color'], ['cost', 'ng-cost'], ['markup', 'ng-markup'],
                           ['price', 'ng-price'], ['qty', 'ng-qty']]) {
    const field = document.getElementById(id);
    if (field) ng[key] = field.value;
  }
}

/**
 * Скидка на весь чек.
 *
 * Сумму вводят руками: «скинь двести» звучит в магазине чаще, чем
 * «скинь полтора процента», и считать проценты в уме за прилавком
 * никто не станет. Кнопки рядом — на самые ходовые суммы.
 */
function sheetWhole() {
  const t = total();
  const построчно = t.off - t.whole;
  const room = capped()
    ? Math.max(0, Math.min(data.limit * t.count, t.gross) - построчно)
    : Math.max(0, t.gross - построчно);

  return `
    <h3>Скидка на чек</h3>
    <p class="q">К оплате сейчас ${som(t.due)}. Скидка задаётся в сомах, а не в процентах.</p>

    <div class="chipsrow" style="margin-bottom:12px">
      ${QUICK_OFF.filter((v) => v <= room).map((v) => `
        <button class="chipx" type="button" data-setwhole="${v}" aria-pressed="${t.whole === v}">−${som(v)}</button>`).join('')}
      ${t.whole ? '<button class="chipx" type="button" data-setwhole="0">убрать скидку</button>' : ''}
    </div>

    <div class="pair">
      <label class="fld"><span>Скинуть, сом</span>
        <input id="whole-value" type="number" inputmode="numeric" value="${t.whole}" min="0" max="${room}" autofocus></label>
      <label class="fld"><span>Отдать за, сом</span>
        <input id="whole-final" type="number" inputmode="numeric" value="${t.gross - t.off}"
               min="${t.gross - построчно - room}" max="${t.gross - построчно}"></label>
    </div>
    <p class="q2">Можно задать любое из двух: впишете «отдать за 11 500» — скидка посчитается сама.</p>

    ${capped()
      ? `<p class="q2">Ваш предел — ${som(data.limit)} с позиции, на этот чек ${som(room)}${построчно ? ` (${som(построчно)} уже скинуто по строкам)` : ''}.</p>`
      : '<p class="q2">Скидка без предела: главное, чтобы цена не ушла ниже нуля.</p>'}

    <button class="btn" id="whole-save" type="button">Применить</button>
    <button class="btn line" data-shut="1" type="button">Отмена</button>`;
}

/**
 * Вход во владельца.

 * Листом поверх кассы, а не отдельным экраном: продавец не должен
 * видеть, как его смену закрывают ради чужих настроек. Отменил —
 * и ты снова за прилавком, ничего не потеряно.

function sheetOwnerPin() {
  const setup = ownerSetup();
  const подпись = setup ? (newPin === null ? 'дальше' : 'повторить') : 'войти';

    ? (newPin === null
      ? (changing
        ? 'Придумайте новый код — четыре цифры.'
        : 'Кода ещё нет. Придумайте свой — четыре цифры. Он закрывает закупочные цены, выручку и настройки.')
      : 'Наберите тот же код ещё раз.')
    : 'Четыре цифры.';

  return `
    <h3>${setup ? (changing ? 'Новый код' : 'Код владельца') : 'Вход для владельца'}</h3>

/* ----------------------------------------------------------------- возврат */

/** Сколько дней после покупки возврат оформляет кассир; позже — только владелец. */
const RETURN_DAYS = 14;
/** Что отмечено к возврату: номер строки -> { codes: коробки, n: штуки без кода }. */
let retPick = {};
/** Строка поиска чека. */
let chkSearch = '';

const checkNo = (c) => c.id.replace(/\D/g, '') || '1';
const lineLeft = (l) => l.qty - (l.ret ?? 0);
const checkLeft = (c) => c.lines.reduce((s, l) => s + lineLeft(l), 0);
/** Товар строки: по id, а у старых чеков, где его нет, — по названию. */
const lineGood = (l) => (l.id && good(l.id)) || data.goods.find((g) => g.name === l.name) || null;
/**
 * Коробки, которые можно отметить поштучно, — только у штучного товара.
 * У чехла код один на все штуки, и «коробкой» он не считается: такие
 * штуки возвращают счётчиком.
 */
const codesLeft = (l) => {
  const g = lineGood(l);
  const serial = g ? isSerial(g) : (l.codes ?? []).length > 1;
  return serial ? (l.codes ?? []).filter((c) => !(l.retCodes ?? []).includes(c)) : [];
};
const plainLeft = (l) => Math.max(0, lineLeft(l) - codesLeft(l).length);
const unitCost = (l) => l.cost ?? lineGood(l)?.cost ?? 0;
const picked = (i) => (retPick[i] ? retPick[i].codes.length + retPick[i].n : 0);

/**
 * Сколько вернуть покупателю.
 *
 * Скидка на всю покупку делится между строками пропорционально их цене,
 * а последняя штука чека забирает остаток до копейки: сколько заплатили,
 * столько и вернули, без накопившейся округлением разницы.
 */
function returnQuote(c) {
  const sumNet = c.lines.reduce((s, l) => s + l.price * l.qty - l.off, 0);
  const lineOff = c.lines.reduce((s, l) => s + l.off, 0);
  const wholeDisc = Math.max(0, c.off - lineOff);
  let gross = 0, part = 0, cost = 0, units = 0;
  const lines = [];
  c.lines.forEach((l, i) => {
    const n = picked(i);
    if (!n) return;
    const unitOff = l.off / l.qty;
    gross += l.price * n;
    part += (l.price - unitOff) * n;
    cost += unitCost(l) * n;
    units += n;
    lines.push({ i, n, off: Math.round(unitOff * n) });
  });
  const last = units > 0 && checkLeft(c) - units === 0;
  const refund = last
    ? c.total - (c.refunded ?? 0)
    : Math.round(part - (sumNet > 0 ? (wholeDisc * part) / sumNet : 0));
  return { refund, gross, cost, units, lines };
}

/** Поиск чека для возврата: по коробке (IMEI), названию или номеру. */
function findBox() {
  const q = chkSearch.trim().toLowerCase();
  const sales = salesOnly(data.checks).slice().reverse();
  const list = (q
    ? sales.filter((c) => checkNo(c).includes(q)
      || c.lines.some((l) => l.name.toLowerCase().includes(q) || (l.codes ?? []).some((x) => x.toLowerCase().includes(q))))
    : sales).slice(0, 8);

  return `
    <h2>Найти чек для возврата</h2>
    <div class="search">
      ${svg('scan', 18)}
      <input id="chk-q" value="${esc(chkSearch)}" placeholder="IMEI, товар или номер чека" autocomplete="off">
    </div>
    ${list.length === 0 ? '<p class="q">Ничего не нашлось.</p>' : `
      <div class="rows">
        ${list.map((c) => `
          <div class="row">
            <button class="plain grow" type="button" data-receipt="${c.id}">
              <div class="t n">${som(c.total)}${checkLeft(c) === 0 ? ' <span class="tag nt">всё возвращено</span>' : ''}</div>
              <div class="q2">${esc(c.lines.map((l) => l.name).join(', '))}</div>
              <div class="q2">${new Date(c.at).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}, ${esc(c.by)}</div>
            </button>
          </div>`).join('')}
      </div>`}`;
}

function sheetReturn(id) {
  const c = data.checks.find((x) => x.id === id);
  const q = returnQuote(c);
  return `
    <h3>Возврат по чеку № ${checkNo(c)}</h3>
    <p class="q">${new Date(c.at).toLocaleDateString('ru-RU')}, продал ${esc(c.by)}. Отметьте, что возвращает покупатель.</p>
    <div class="rows">
      ${c.lines.map((l, i) => {
        const left = lineLeft(l);

        const pick = retPick[i] ?? { codes: [], n: 0 };
        return `<div class="row"><div class="grow">
          <div class="t">${esc(l.name)}</div>

    <button class="btn line" data-shut="1" type="button">Закрыть</button>`;

function sheetCam() {
  return `

    <div style="border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3">
      <video id="cam-video" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
    </div>
    <p class="q2" id="cam-note" style="margin-top:10px">Запрашиваю доступ к камере…</p>
    <button class="btn line" id="cam-close" type="button">Закрыть</button>`;
}

/** Камера живёт только пока открыт лист: иначе индикатор съёмки горит всегда. */
async function camStart() {
  const video = document.getElementById('cam-video');
  const note = document.getElementById('cam-note');
  if (!video) return;

  try {
    camera = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = camera;
    await video.play();
    note.textContent = 'Ищу штрих-код…';
  } catch (error) {
    note.textContent = 'Камера не открылась: ' + (error.name === 'NotAllowedError'
      ? 'доступ не разрешён. Разрешите камеру в настройках браузера.'
      : 'её нет или она занята другим приложением.');
    return;
  }

  const detector = new BarcodeDetector();
  const tick = async () => {
    if (!camera || sheet?.k !== 'cam') return;
    try {
      const found = await detector.detect(video);
      if (found.length) {
        const code = found[0].rawValue;
        camStop();
        sheet = null;
        render();
        onScan(code);
        return;
      }
    } catch (e) { /* кадр не разобрался — просто следующий */ }
    setTimeout(tick, 250);
  };
  setTimeout(tick, 400);
}

function camStop() {
  camera?.getTracks().forEach((t) => t.stop());
  camera = null;
}

/* --------------------------------------------------------------- вывод */

function render() {
  document.getElementById('app').hidden = false;

  document.getElementById('who').textContent = owner() ? 'Владелец' : me()?.name ?? 'Выберите имя';
  document.getElementById('shop').textContent = data.shopName;
  // Заголовок окна программы повторяет название магазина.
  document.title = `Касса — ${data.shopName}`;

  const link = document.getElementById('link');
  link.textContent = online ? 'в сети' : 'без сети';
  // Не data-off: так зовётся кнопка скидки, и нажатие по указателю
  // сети уводило бы в лист скидки несуществующей строки.
  link.dataset.down = online ? '' : '1';
  // Программа на компьютере с интернетом не связана — индикатор только путает.
  link.style.display = DESK ? 'none' : '';

  const main = document.getElementById('screen');
  const keep = main.scrollTop;
  main.innerHTML = tab === 'sale' ? viewSale()
    : tab === 'intake' ? viewIntake()
    : tab === 'inv' ? viewInventory()
    : tab === 'report' ? viewReport()
    : tab === 'goods' ? viewGoods()
    : tab === 'checks' ? viewChecks()
    : viewMore();
  main.scrollTop = keep;

  const tabs = TABS[owner() ? 'owner' : 'cashier'];
  if (tab !== 'inv' && !tabs.some((t) => t.id === tab)) tab = 'sale';
  if (tab === 'inv' && !owner()) tab = 'sale';
  document.getElementById('nav').innerHTML = tabs.map((t) =>
    `<button type="button" data-tab="${t.id}" aria-selected="${t.id === tab || (tab === 'inv' && t.id === 'intake')}">${svg(t.icon)}${t.text}</button>`).join('');

  const t = total();
  const till = document.getElementById('till');
  till.hidden = !(tab === 'sale' && t.count > 0);
  if (!till.hidden) {
    till.innerHTML = `
      <div class="till-head">
        <span class="lines">${t.count} ${plural(t.count, 'штука', 'штуки', 'штук')} в чеке</span>
        <span class="gross n ${t.off ? 'struck' : ''}">${som(t.gross)}</span>
      </div>
      <div class="due"><span class="lbl">К оплате</span><span class="amt${settle ? ' settle' : ''}">${som(t.due)}</span></div>
      <button class="sell" type="button" id="sell">${svg('check')}Продать</button>`;
    settle = false;
  }

  const host = document.getElementById('sheet');
  if (!sheet) { host.innerHTML = ''; return; }
  const body = sheet.k === 'ownerpin' ? sheetOwnerPin()
    : sheet.k === 'pinreset' ? sheetPinReset()
    : sheet.k === 'off' ? sheetOff(sheet.id)
    : sheet.k === 'whole' ? sheetWhole()
    : sheet.k === 'newcode' ? sheetNewCode(sheet.code)
    : sheet.k === 'newgood' ? sheetNewGood()
    : sheet.k === 'take' ? sheetTake(sheet.id)
    : sheet.k === 'edit' ? sheetEdit(sheet.id)
    : sheet.k === 'code' ? sheetCode()
    : sheet.k === 'pick' ? sheetPick()
    : sheet.k === 'receipt' ? sheetReceipt(sheet.id)
    : sheet.k === 'close' ? sheetShift({ ...shiftSummary(), to: Date.now(), by: sellerName() }, 'close')
    : sheet.k === 'shiftview' ? sheetShift(data.shifts.find((x) => x.id === sheet.id), sheet.fresh ? 'done' : 'view')
    : sheet.k === 'return' ? sheetReturn(sheet.id)
    : sheet.k === 'invreview' ? sheetInv({ counted: Object.keys(data.invDraft?.counts ?? {}).filter((id) => good(id)).length, lines: invLines(invDiffs()) }, 'review')
    : sheet.k === 'invview' ? sheetInv(data.inventories.find((x) => x.id === sheet.id), 'view')
    : sheet.k === 'cam' ? sheetCam()
    : '';
  host.innerHTML = `<div class="veil" data-veil="1"><div class="sheet"><div class="grip"></div>${body}</div></div>`;

  const field = document.getElementById('code-field');
  if (field) field.focus();

  // Подсказки графиков вешаются на общий слой, а не на каждый столбец.
  if (tab === 'report') wireTips(document.getElementById('charts'));

  if (sheet?.k === 'cam' && !camera) void camStart();
}

/* ------------------------------------------------------------ действия */

function sell() {
  const t = total();
  if (t.count === 0) return;
  if (needName() || needOpen()) return;

  // Последняя проверка перед списанием: остаток мог измениться, пока чек лежал.
  for (const l of check) {
    const g = good(l.id);
    if (l.qty > g.stock) return flash(`${g.name}: на остатке ${g.stock} шт, в чеке ${l.qty}`);
    for (const code of isSerial(g) ? l.codes ?? [] : []) {
      if (data.sold[code]) return flash(`Коробка ${code} уже продана`);
    }
  }

  const at = Date.now();
  const id = 'c' + at;
  const lines = check.map((l) => {
    const g = good(l.id);
    g.stock = Math.max(0, g.stock - l.qty);
    if (isSerial(g)) for (const code of l.codes ?? []) data.sold[code] = { at, id };
    // id и закупка нужны возврату: по ним штуки возвращаются на остаток, а прибыль считается верно.
    return { id: g.id, name: g.name, price: g.price, qty: l.qty, off: l.off, cost: g.cost, codes: l.codes ?? [] };
  });

  const entry = { id, at, by: sellerName(), byId: owner() ? 'owner' : me().id,
    total: t.due, cost: t.cost, off: t.off, lines };
  data.checks.push(entry);

  check = [];
  checkOff = 0;
  save();
  sheet = { k: 'receipt', id: entry.id };
  render();
  flash('Продано на ' + som(t.due));
}

document.addEventListener('click', (event) => {
  const el = event.target.closest('button, [data-veil]');
  if (!el) return;

  /**
   * Нажатие мимо кнопок внутри листа — не нажатие по затемнению.
   *
   * Лист лежит внутри затемнения, и поиск вверх по дереву от поля ввода
   * доходил до него: касание «Названия» засчитывалось как «ткнул мимо
   * окна» и окно закрывалось. Заполнить карточку было нельзя.
   */
  if (el.dataset.veil && event.target.closest('.sheet')) return;

  const d = el.dataset ?? {};

  /* экран входа */
  if (d.digit) {
    if (d.digit === 'clear') { pin = ''; return render(); }
    if (d.digit === 'enter') {
      if (ownerSetup()) return makeOwnerPin();
      return tryOwnerPin();
    }
    if (pin.length < 4) pin += d.digit;
    // Четыре цифры — проверяем сразу, не дожидаясь кнопки: так быстрее,
    // а длиннее четырёх кодов тут всё равно не бывает. Промахнулся —
    // начинаем заново, иначе клавиатура заперта четырьмя неверными цифрами.
    if (pin.length === 4) {
      if (ownerSetup()) return makeOwnerPin();
      return tryOwnerPin();
    }
    return render();
  }
  /* забытый код владельца */
  if (el.id === 'pin-forgot') { sheet = { k: 'pinreset' }; return render(); }
  if (el.id === 'rc-go') {
    const code = document.getElementById('rc-code').value;
    if (!DESK || !DESK.recover(code)) return flash('Код сброса не подошёл');
    data.accounts = { ...data.accounts, owner: '' };
    data.pinLock = null;
    pin = ''; newPin = null; changing = false;
    save();
    sheet = { k: 'ownerpin' };
    render();
    return flash('Код сброшен. Придумайте новый');
  }

  /* вход и выход владельца */
  if (el.id === 'owner-in') { pin = ''; newPin = null; changing = false; sheet = { k: 'ownerpin' }; return render(); }
  if (el.id === 'pin-change') { pin = ''; newPin = null; changing = true; sheet = { k: 'ownerpin' }; return render(); }
  if (el.id === 'owner-out') return ownerOut('Вы снова за кассой');

  if (d.veil && el.classList.contains('veil')) { camStop(); sheet = null; return render(); }
  if (d.shut) {
    camStop();
    // Владелец закрыл смену и прочитал итог — дальше за кассой уже не он.
    const leave = sheet?.k === 'shiftview' && sheet.fresh && owner() && !pinned;
    // Передумали вводить код — черновик ввода не должен пережить закрытие.
    pin = ''; newPin = null; changing = false;
    sheet = null;
    if (leave) return ownerOut('Смена закрыта. Вы снова за кассой');
    return render();
  }
  if (el.id === 'cam-open') { sheet = { k: 'cam' }; return render(); }
  if (el.id === 'cam-close') { camStop(); sheet = null; return render(); }
  if (d.tab) { tab = d.tab; sheet = null; render(); document.getElementById('screen').scrollTop = 0; return; }

  if (d.period) { repPeriod = d.period; return render(); }

  /* кто за кассой */
  if (d.who) {
    const s = data.staff.find((x) => x.id === d.who);
    if (!s) return;
    sellerId = s.id;
    render();
    return flash(`Здравствуйте, ${s.name}`);
  }
  if (el.id === 'who-change') {
    if (check.length) return flash('Сначала закончите или отмените чек');
    sellerId = null; tab = 'sale';
    return render();
  }
  if (el.id === 'staff-add') {
    const name = document.getElementById('staff-name').value.trim().replace(/\s+/g, ' ');
    if (!name) return flash('Впишите имя');
    if (name.toLowerCase() === 'владелец' || data.staff.some((x) => x.name.toLowerCase() === name.toLowerCase())) {
      return flash(`Имя «${name}» уже занято`);
    }
    data.staff.push({ id: 's' + Date.now(), name });
    save(); render();
    return flash(`${name} добавлен(а) на кассу`);
  }
  if (d.staffdel) {
    const s = data.staff.find((x) => x.id === d.staffdel);
    if (!s) return;
    data.staff = data.staff.filter((x) => x.id !== s.id);
    if (sellerId === s.id) sellerId = null;
    save(); render();
    return flash(`${s.name} убран(а). Прошлые чеки остаются`);
  }

  /* инвентаризация */
  if (el.id === 'inv-start') {
    if (!owner()) return;
    if (!data.invDraft) data.invDraft = { at: Date.now(), by: sellerName(), counts: {} };
    invSearch = ''; tab = 'inv';
    save(); return render();
  }
  if (el.id === 'inv-q-clear') { invSearch = ''; return render(); }
  if (el.id === 'inv-review') {
    if (!owner() || !data.invDraft) return;
    if (Object.keys(data.invDraft.counts).filter((id) => good(id)).length === 0) return flash('Пока ничего не посчитано');
    sheet = { k: 'invreview' }; return render();
  }
  if (el.id === 'inv-cancel') {
    if (!owner()) return;
    data.invDraft = null; tab = 'intake'; sheet = null;
    save(); render();
    return flash('Инвентаризация отменена, остатки не менялись');
  }
  if (el.id === 'inv-apply') {
    const draft = data.invDraft;
    if (!owner() || !draft) return;
    const diffs = invDiffs();
    const counted = Object.keys(draft.counts).filter((id) => good(id)).length;
    if (counted === 0) return flash('Пока ничего не посчитано');
    const lines = invLines(diffs);
    // Сдвигаем остаток на разницу, а не ставим число: продажи после пересчёта не теряются.
    for (const { g, diff } of diffs) {
      g.stock = Math.max(0, g.stock + diff);
      logIntake(g, diff, 'inv');
    }
    data.inventories.push({ id: 'v' + Date.now(), at: Date.now(), from: draft.at, by: sellerName(), counted, lines });
    data.invDraft = null; tab = 'intake'; sheet = null;
    save(); render();
    return flash(lines.length ? `Инвентаризация записана: расхождений ${lines.length}` : 'Инвентаризация записана: всё сошлось');
  }
  if (d.invview) { sheet = { k: 'invview', id: d.invview }; return render(); }

  /* возврат */
  if (el.id === 'ret-open') {
    const c = data.checks.find((x) => x.id === sheet?.id);
    if (!c || isReturn(c)) return;
    if (needName() || needOpen()) return;
    if (!owner() && Date.now() - c.at > RETURN_DAYS * 86400e3) {
      return flash(`Прошло больше ${RETURN_DAYS} дней — возврат оформляет владелец`);
    }
    retPick = {};
    sheet = { k: 'return', id: c.id };
    return render();
  }
  if (d.retcode !== undefined) {
    const pick = (retPick[Number(d.retcode)] ??= { codes: [], n: 0 });
    pick.codes = pick.codes.includes(d.code) ? pick.codes.filter((x) => x !== d.code) : [...pick.codes, d.code];
    return render();
  }
  if (d.retmore !== undefined || d.retless !== undefined) {
    const i = Number(d.retmore ?? d.retless);
    const c = data.checks.find((x) => x.id === sheet?.id);
    const pick = (retPick[i] ??= { codes: [], n: 0 });
    pick.n = Math.max(0, Math.min(plainLeft(c.lines[i]), pick.n + (d.retmore !== undefined ? 1 : -1)));
    return render();
  }
  if (el.id === 'ret-confirm') {
    const c = data.checks.find((x) => x.id === sheet?.id);
    if (!c || isReturn(c)) return;
    if (needName() || needOpen()) return;
    const q = returnQuote(c);
    if (q.units === 0) return flash('Отметьте, что возвращают');

    const at = Date.now();
    const id = 'r' + at;
    const lines = q.lines.map(({ i, n, off }) => {
      const l = c.lines[i];
      const codes = retPick[i].codes;
      const g = lineGood(l);
      const line = { id: l.id, name: l.name, price: l.price, qty: -n, off: -off, cost: unitCost(l), codes };
      l.ret = (l.ret ?? 0) + n;
      if (codes.length) l.retCodes = [...(l.retCodes ?? []), ...codes];
      if (g) {
        g.stock += n;
        // Коробка снова в продаже: её опять можно пикнуть.
        for (const code of codes) {
          delete data.sold[code];
          if (!g.codes.includes(code)) g.codes.push(code);
        }
      }
      return line;
    });
    c.refunded = (c.refunded ?? 0) + q.refund;
    data.checks.push({ id, at, by: sellerName(), byId: owner() ? 'owner' : me().id, kind: 'return', of: c.id,
      total: -q.refund, cost: -q.cost, off: -(q.gross - q.refund), lines });
    retPick = {};
    sheet = { k: 'receipt', id };
    save(); render();
    return flash(`Возврат оформлен: верните покупателю ${som(q.refund)}`);
  }

  /* открытие и закрытие смены */
  if (el.id === 'shift-open') {
    if (needName()) return;
    if (data.shiftOpen) return render();
    data.shiftOpen = { at: Date.now(), by: sellerName(), byId: owner() ? 'owner' : me().id };
    save(); render();
    return flash(`Смена открыта, ${sellerName()}`);
  }
  if (el.id === 'shift-close') {
    if (needName()) return;
    if (check.length) return flash('Сначала закончите или отмените чек');
    if (shift().length === 0) return flash('В смене не было продаж — закрывать нечего');
    sheet = { k: 'close' };
    return render();
  }
  if (el.id === 'shift-confirm') {
    if (needName()) return;
    if (check.length) { sheet = null; render(); return flash('Сначала закончите или отмените чек'); }
    const summary = shiftSummary();
    if (shift().length === 0) { sheet = null; render(); return flash('В смене не было продаж — закрывать нечего'); }
    const to = Date.now();
    const rec = { id: 'sh' + to, ...summary, to, by: sellerName(), byId: owner() ? 'owner' : me().id };
    data.shifts.push(rec);
    data.shiftOpen = null;
    // +1: чек, оформленный в ту же миллисекунду, не должен попасть в обе смены.
    data.shiftStart = to + 1;
    // Конец смены — самое подходящее время для копии: итог дня уже записан.
    try { DESK?.backup(); } catch (error) { /* копия не повод не закрывать смену */ }
    // Следующий кассир выберет себя сам: смена закончилась вместе с прежним.
    if (!owner()) sellerId = null;
    sheet = { k: 'shiftview', id: rec.id, fresh: true };
    save(); render();
    return flash('Смена закрыта');
  }
  if (d.shiftview) { sheet = { k: 'shiftview', id: d.shiftview }; return render(); }
  if (el.id === 'shift-copy') {
    const rec = data.shifts.find((x) => x.id === sheet?.id);
    if (!rec) return;
    navigator.clipboard?.writeText(shiftText(rec)).then(
      () => flash('Итог скопирован, можно отправлять'),
      () => flash('Скопировать не вышло — выделите текст мышкой'));
    return;
  }

  /* продажа */
  if (d.add) {
    if (needName() || needOpen()) return;
    const g = good(d.add);
    if (!g || g.stock <= 0) return flash('На остатке ноль');
    if (!addLine(d.add)) return;
    settle = true;
    if (sheet?.k === 'pick') sheet = null;
    return render();
  }
  if (d.less) {
    const l = check.find((x) => x.id === d.less);
    l.qty -= 1;
    if (l.qty <= 0) check = check.filter((x) => x.id !== d.less);
    else l.off = Math.min(l.off, good(d.less).price * l.qty);
    settle = true; return render();
  }
  if (el.id === 'check-drop') { check = []; checkOff = 0; return render(); }
  if (el.id === 'sell') return sell();

  /* скидка в сомах */
  if (el.id === 'whole-off') { sheet = { k: 'whole' }; return render(); }
  if (d.setwhole !== undefined) { checkOff = Number(d.setwhole); return render(); }
  if (el.id === 'whole-save') {
    const t = total();
    const построчно = t.off - t.whole;
    const room = capped()
      ? Math.max(0, Math.min(data.limit * t.count, t.gross) - построчно)
      : Math.max(0, t.gross - построчно);

    const typedOff = Number(document.getElementById('whole-value').value);
    const typedFinal = Number(document.getElementById('whole-final').value);
    // Что изменили, то и слушаем: «отдать за» удобнее при торге.
    const want = typedOff !== t.whole ? typedOff : t.gross - построчно - typedFinal;
    const off = Math.max(0, Math.round(want));

    if (off > room) {
      return flash(capped()
        ? `Ваш предел на этот чек — ${som(room)}. Позовите владельца`
        : `Больше ${som(room)} скинуть нельзя`);
    }
    checkOff = off;
    sheet = null; settle = true; return render();
  }

  if (d.off) { sheet = { k: 'off', id: d.off }; return render(); }
  if (d.setoff) {
    const l = check.find((x) => x.id === d.setoff);
    l.off = Number(d.v);
    return render();
  }
  if (d.offsave) {
    const l = check.find((x) => x.id === d.offsave);
    const g = good(d.offsave);
    const sum = g.price * l.qty;
    const cap = capped() ? Math.min(data.limit * l.qty, sum) : sum;

    const typedOff = Number(document.getElementById('off-value').value);
    const typedFinal = Number(document.getElementById('off-final').value);
    // Что изменили, то и слушаем: «отдать за» удобнее при торге.
    const want = typedOff !== l.off ? typedOff : sum - typedFinal;
    const off = Math.max(0, Math.round(want));

    if (off > cap) {
      return flash(capped()
        ? `Ваш предел — ${som(cap)}. Позовите владельца`
        : `Больше ${som(sum)} скинуть нельзя`);
    }
    l.off = off;
    sheet = null; settle = true; return render();
  }

  /* сканер вручную и список */
  if (el.id === 'code-manual') { sheet = { k: 'code' }; return render(); }
  if (el.id === 'pick-list') { plSearch = ''; sheet = { k: 'pick' }; return render(); }
  if (el.id === 'pl-clear') { plSearch = ''; return render(); }
  if (el.id === 'code-go') {
    const code = document.getElementById('code-field').value.trim();
    if (!code) return flash('Введите код');
    sheet = null; render();
    return onScan(code);
  }

  /* приём */
  const ngFresh = (code) => ({ code, model: '', ram: '', mem: '', color: '',
                               cost: '', markup: 100, price: '', qty: 1, bad: null });

  if (el.id === 'good-new') { ng = ngFresh(''); sheet = { k: 'newgood' }; return render(); }
  if (el.id === 'ng-open') { ng = ngFresh(sheet?.code ?? ''); sheet = { k: 'newgood' }; return render(); }
  if (el.id === 'pick-clear') { pick = ''; return render(); }

  // Коробка той же модели: код прибавляется к товару, остаток растёт.
  if (d.attach) {
    if (needName()) return;
    const g = good(d.attach);
    const code = sheet?.code;
    if (code && !g.codes.includes(code)) g.codes.push(code);
    // Кодов за год набегают сотни, а нужны только для узнавания.
    if (g.codes.length > 300) g.codes = g.codes.slice(-300);
    g.stock += 1;
    g.at = Date.now();
    logIntake(g, 1, 'box', code);
    sheet = null; save(); render();
    return flash(`${g.name}: стало ${g.stock} шт`);
  }

  // Кнопка-подсказка памяти или цвета: повторное нажатие снимает выбор.
  if (d.ngset) {
    ngRead();
    ng[d.ngset] = ng[d.ngset] === d.ngval ? '' : d.ngval;
    return render();
  }
  if (el.id === 'ng-save') {
    if (needName()) return;
    ngRead();
    const name = ngName();
    const cost = Number(ng.cost);
    const price = Number(ng.price);
    // С пикнутой коробки приходит ровно одна штука; число спрашиваем только
    // когда товар заводят руками, без кода.
    const qty = ng.code ? 1 : Math.max(1, Number(ng.qty) || 1);

    // Промах показываем у самого поля: подпись внизу экрана, в трёхстах
    // точках от кнопки, человек просто не замечает — и решает, что
    // программа не работает.
    ng.bad = !ng.model.trim() ? 'model' : !(cost > 0) ? 'cost' : !(price > 0) ? 'price' : null;
    if (ng.bad) { render(); return; }

    const same = data.goods.find((g) => g.name.toLowerCase() === name.toLowerCase());
    if (same) {
      ng.bad = 'model';
      render();
      return flash(`«${same.name}» уже заведён — выберите его в списке`);
    }

    const made = {
      id: 'g' + Date.now(),
      codes: ng.code ? [ng.code] : [],
      name,
      model: ng.model.trim(),
      ram: String(ng.ram).trim(),
      mem: String(ng.mem).trim(),
      color: String(ng.color).trim(),
      cost, price,
      stock: qty,
      at: Date.now(),
    };
    data.goods.push(made);
    logIntake(made, qty, ng.code ? 'new-box' : 'new', ng.code);
    ng = null;
    sheet = null; save(); render();
    return flash(`${name}: принято ${qty} шт, наценка ${Math.round(((price - cost) / cost) * 100)}%`);
  }
  if (d.tksave) {
    if (needName()) return;
    const g = good(d.tksave);
    const qty = Math.max(1, Number(document.getElementById('tk-qty').value) || 1);
    g.stock += qty;
    logIntake(g, qty, 'qty');
    // Закупку и цену меняет только владелец: у кассира этих полей нет.
    const costField = document.getElementById('tk-cost');
    const priceField = document.getElementById('tk-price');
    if (costField) g.cost = Number(costField.value) || g.cost;
    if (priceField) g.price = Number(priceField.value) || g.price;
    g.at = Date.now();
    sheet = null; save(); render();
    return flash(`${g.name}: стало ${g.stock} шт`);
  }
  if (d.edit) { sheet = { k: 'edit', id: d.edit }; return render(); }
  if (d.edsave) {
    const g = good(d.edsave);
    const name = document.getElementById('ed-name').value.trim();
    const code = document.getElementById('ed-code').value.trim();
    if (!name) return flash('Нужно название');
    if (code) {
      const other = byCode(code);
      if (other && other.id !== g.id) return flash(`Этот код уже у товара «${other.name}»`);
      if (!g.codes.includes(code)) g.codes.push(code);
    }
    g.name = name;
    // Цены и остаток правит только владелец: у кассира этих полей нет.
    if (owner()) {
      const was = g.stock;
      g.cost = Number(document.getElementById('ed-cost').value) || g.cost;
      g.price = Number(document.getElementById('ed-price').value) || g.price;
      g.stock = Math.max(0, Number(document.getElementById('ed-stock').value) || 0);
      if (g.stock !== was) logIntake(g, g.stock - was, 'fix');
    }
    sheet = null; save(); render();
    return flash('Сохранено');
  }
  if (d.uncode) {
    const g = good(d.uncode);
    g.codes = g.codes.filter((c) => c !== d.code);
    save(); render();
    return flash('Код отвязан');
  }
  if (d.eddel) {
    if (!owner()) return;
    data.goods = data.goods.filter((g) => g.id !== d.eddel);
    check = check.filter((l) => l.id !== d.eddel);
    sheet = null; save(); render();
    return flash('Товар убран');
  }

  /* чеки */
  if (el.id === 'xlsx') {
    const result = exportWorkbook();
    return flash(result.ok
      ? (DESK ? 'Книга сохранена: ' + result.where : 'Книга скачивается')
      : 'Выгрузить не вышло — здесь браузер не даёт сохранять файлы');
  }
  if (d.receipt) { sheet = { k: 'receipt', id: d.receipt }; return render(); }

  /* настройки */
  if (el.id === 'shop-save') {
    const name = document.getElementById('shop-name').value.trim().replace(/\s+/g, ' ');
    if (!name) return flash('Впишите название магазина');
    data.shopName = name.slice(0, 40);
    save(); render();
    return flash(`Магазин: ${data.shopName}`);
  }
  if (el.id === 'limit-toggle') {
    data.limitOn = !data.limitOn;
    save(); render();
    return flash(data.limitOn ? 'Предел скидки включён' : 'Предел скидки выключен');
  }
  if (el.id === 'limit-save') {
    data.limit = Math.max(0, Number(document.getElementById('limit').value) || 0);
    save(); render();
    return flash(`Предел скидки кассира — ${som(data.limit)}`);
  }
  if (el.id === 'q-clear') { search = ''; return render(); }
  if (el.id === 'note-save') {
    const text = document.getElementById('note-in').value.trim();
    if (!text) return flash('Напишите замечание');
    data.notes.push(text); save(); render();
    return flash('Записано');
  }
  if (d.nodrop) { data.notes.splice(Number(d.nodrop), 1); save(); return render(); }
  if (el.id === 'note-copy') {
    const text = data.notes.map((n, i) => `${i + 1}. ${n}`).join('\n');
    navigator.clipboard?.writeText(text).then(
      () => flash('Скопировано, можно отправлять'),
      () => flash('Скопировать не вышло — выделите текст мышкой'));
    return;
  }
  if (el.id === 'auto-toggle') {
    const стало = DESK.autoSet(!DESK.autoGet());
    render();
    return flash(стало ? 'Касса будет открываться при включении' : 'Открывать придётся вручную');
  }
  if (el.id === 'open-folder') { DESK?.reveal(); return; }
  if (el.id === 'backup') {
    const name = DESK?.backup();
    return flash(name ? 'Копия сделана: ' + name : 'Копию сделать не вышло');
  }
  if (el.id === 'install') {
    if (!installer) return flash('Браузер не предлагает установку — откройте в Chrome или Edge');
    installer.prompt();
    installer.userChoice.then((choice) => {
      installer = null;
      render();
      flash(choice.outcome === 'accepted' ? 'Касса установлена' : 'Установку отменили');
    });
    return;
  }
  if (el.id === 'reset') {
    data = freshData();
    if (pinned) data.role = pinned;
    check = []; sheet = null; search = ''; lastScan = null;
    save(); render();
    return flash('Демонстрация вернулась в исходный вид');
  }
});

/* Подсчёт сохраняем, когда поле отпустили: не на каждую цифру. */
document.addEventListener('change', (event) => {
  if (event.target.dataset?.inv !== undefined) save();
});

/* Наценка и цена ходят парой: меняешь одно — пересчитывается второе. */
document.addEventListener('input', (event) => {
  const invId = event.target.dataset?.inv;
  if (invId) {
    const g = good(invId);
    const d = data.invDraft;
    if (!g || !d) return;
    const raw = event.target.value;
    const note = document.getElementById('inv-d-' + invId);
    if (raw === '') { delete d.counts[invId]; if (note) note.textContent = ''; invRefresh(); return; }
    const n = Math.floor(Number(raw));
    if (!(n >= 0)) return;
    // Остаток на момент пересчёта запоминаем: от него и считается разница.
    d.counts[invId] = { n, base: g.stock };
    if (note) note.textContent = invDiffText(n, g.stock);
    invRefresh();
    return;
  }
  const id = event.target.id;

  // Отбор перерисовывает список под полем, поэтому возвращаем в поле
  // и место ввода: иначе с третьей буквы курсор прыгает в начало.
  for (const [поле, запись] of [['q', (v) => { search = v; }], ['pick-q', (v) => { pick = v; }], ['chk-q', (v) => { chkSearch = v; }], ['pl-q', (v) => { plSearch = v; }], ['inv-q', (v) => { invSearch = v; }]]) {
    if (id !== поле) continue;
    запись(event.target.value);
    const pos = event.target.selectionStart;
    render();
    const field = document.getElementById(поле);
    if (field) { field.focus(); field.setSelectionRange(pos, pos); }
    return;
  }

  const pairs = { 'ng-cost': 'ng', 'ng-markup': 'ng', 'ng-price': 'ng', 'tk-cost': 'tk', 'tk-markup': 'tk', 'tk-price': 'tk' };
  const p = pairs[id];
  if (!p) return;

  const cost = Number(document.getElementById(`${p}-cost`)?.value);
  const markupField = document.getElementById(`${p}-markup`);
  const priceField = document.getElementById(`${p}-price`);
  if (!(cost > 0) || !markupField || !priceField) return;

  if (id === `${p}-price`) {
    const price = Number(priceField.value);
    markupField.value = price > 0 ? Math.round(((price - cost) / cost) * 100) : '';
  } else {
    const m = Number(markupField.value);
    priceField.value = Number.isFinite(m) ? Math.round(cost * (1 + m / 100)) : '';
  }
});

/* --------------------------------------------------- автовыход владельца */

/**
 * Владелец не должен оставаться «внутри», когда отошёл от кассы: за его
 * записью закупка и прибыль. Пока он что-то нажимает, касса не мешает;
 * замолчал на пять минут — возвращаемся к кассиру. Ссылка «?role=owner»
 * (демонстрация) не выходит: там владелец задан адресом, а не кодом.
 */
let OWNER_IDLE_MS = 5 * 60e3;
let lastTouch = Date.now();
for (const type of ['pointerdown', 'keydown']) {
  document.addEventListener(type, () => { lastTouch = Date.now(); }, true);
}

function ownerOut(text) {
  signed = 'cashier'; data.role = 'cashier'; tab = 'sale'; sellerId = null;
  sheet = null; pin = ''; newPin = null; changing = false;
  save(); render();
  return flash(text);
}

function idleCheck() {
  if (!owner() || pinned) return;
  if (Date.now() - lastTouch < OWNER_IDLE_MS) return;
  ownerOut('Владелец вышел: долго не было действий');
}
setInterval(idleCheck, 10000);

/* ---------------------------------------------------- работа без сети */

function linkChanged() {
  online = navigator.onLine;
  if (DESK) return;
  render();
  flash(online ? 'Интернет вернулся' : 'Интернета нет. Касса работает, данные останутся здесь');
}
window.addEventListener('online', linkChanged);
window.addEventListener('offline', linkChanged);

window.addEventListener('beforeinstallprompt', (event) => {
  // Браузер готов поставить программу: перехватываем приглашение,
  // чтобы показать свою кнопку в понятном месте, а не ждать его подсказки.
  event.preventDefault();
  installer = event;
  if (tab === 'more') render();
});

window.addEventListener('appinstalled', () => {
  installer = null;
  if (tab === 'more') render();
  flash('Касса установлена, запускайте с рабочего стола');
});

async function offlineReady() {
  const state = document.getElementById('sw-state');
  const note = document.getElementById('install-note');
  const button = document.getElementById('install');

  if (button) {
    const standalone = matchMedia('(display-mode: standalone)').matches;
    button.hidden = !installer || standalone;
    if (note) {
      note.textContent = standalone
        ? 'Уже запущена как программа.'
        : installer
          ? ''
          : 'Если кнопки нет: в Chrome или Edge откройте меню и выберите «Установить».';
    }
  }

  if (!state) return;
  if (!('serviceWorker' in navigator)) {
    state.textContent = 'этот браузер офлайн не умеет';
    return;
  }
  const reg = await navigator.serviceWorker.getRegistration();
  state.textContent = reg?.active ? 'страницы сохранены, откроется без интернета' : 'готовлю…';
}

if ('serviceWorker' in navigator) {
  // На локальном файле и внутри встроенных окон регистрация запрещена —
  // это нормально, касса просто останется обычной страницей.
  navigator.serviceWorker.register('./sw.js').then(
    () => { if (tab === 'more') render(); },
    () => undefined,
  );
}

const paint = render;
render = function () { paint(); void offlineReady(); };

render();
</script>
