<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3f6e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111614" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Демонстрация учётной системы. Телефоны и чехлы.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png">
<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  /* Цвет бизнеса: шапка, активный раздел, кнопка действия. */
  :root { --brand: #1d3f6e; }
  body { margin: 0; font: 14px system-ui, sans-serif; background: #e8e9e4; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<title>Телефоны и чехлы</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Касса магазина телефонов.
     Место: прилавок со стеклянной витриной, холодный свет, ноутбук открыт
     десять часов. Отсюда светлый холодный фон без бликов, волосяные линии
     вместо карточек с тенями и единственная крупная вещь на экране — сумма.
     Цифры набраны моноширинным: это показания прибора, они обязаны стоять
     в столбик и читаться через прилавок. */
  :root {
    --glass:  #eef1f4;
    --card:   #ffffff;
    --sunk:   #e2e7ec;
    --ink:    #0e1620;
    --ink-2:  #51606e;
    --ink-3:  #5f6e7c;
    --line:   #d4dae1;
    --edge:   #b9c3cd;

    --brand:  #1d3f6e;
    --on-brand: #ffffff;
    --money:  #0b6b4f;
    --cut:    #b4531a;
    --alarm:  #b3261e;

    /* Ряды графиков: себестоимость и прибыль. */
    --mark-1: #2f6fb5;
    --mark-2: #0f8a5f;
    --grid:   #e3e8ed;

    --ui:   'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --num:  'Fira Code', ui-monospace, 'Cascadia Mono', monospace;

    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    --r: 4px;
    --tap: 44px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --glass:  #0f1419;
      --card:   #161d24;
      --sunk:   #0a0e12;
      --ink:    #e9eef3;
      --ink-2:  #9aa8b5;
      --ink-3:  #93a1ae;
      --line:   #263038;
      --edge:   #37434d;
      --brand:  #3f72b4;
      --on-brand: #ffffff;
      --money:  #3fb389;
      --cut:    #e08a4d;
      --alarm:  #e0655c;
    --mark-1: #4a8ccc;
    --mark-2: #2f9a73;
    --grid:   #222b33;
      --mark-1: #4a8ccc;
      --mark-2: #2f9a73;
      --grid:   #222b33;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --glass:  #0f1419;
    --card:   #161d24;
    --sunk:   #0a0e12;
    --ink:    #e9eef3;
    --ink-2:  #9aa8b5;
    --ink-3:  #93a1ae;
    --line:   #263038;
    --edge:   #37434d;
    --brand:  #3f72b4;
    --on-brand: #ffffff;
    --money:  #3fb389;
    --cut:    #e08a4d;
    --alarm:  #e0655c;
    --mark-1: #4a8ccc;
    --mark-2: #2f9a73;
    --grid:   #222b33;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--glass);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 15px;
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
  }

  ::selection { background: var(--brand); color: var(--on-brand); }
  :where(input, textarea) { caret-color: var(--brand); }
  * { scrollbar-width: thin; scrollbar-color: var(--edge) transparent; }
  *::-webkit-scrollbar { width: 7px; height: 7px; }
  *::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 99px; }
  :where(button, input, select, textarea, a):focus-visible {
    outline: 2px solid var(--brand); outline-offset: 2px;
  }

  button { font: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }
  svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* Цифры — показания прибора. */
  .n { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

  /* -------------------------------------------------------------- каркас */
  #app { display: flex; flex-direction: column; height: 100%; max-width: 520px; margin: 0 auto; }
  #app.desk { max-width: 1180px; }

  header.top { background: var(--brand); color: var(--on-brand); padding: var(--s3) var(--s4); flex: none; }
  .toprow { display: flex; align-items: center; gap: var(--s3); min-height: 28px; }
  .place { font-size: 16px; font-weight: 600; letter-spacing: -.01em; flex: 1; min-width: 0;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.26); color: inherit;
         border-radius: var(--r); padding: 5px 10px; font-size: 13px; font-weight: 500; }
  /* Связь: продавец должен видеть, что касса жива и без интернета. */
  .link { font-size: 12px; font-family: var(--num); padding: 3px 8px; border-radius: var(--r);
          background: rgba(255,255,255,.14); color: var(--on-brand); white-space: nowrap; }
  .link[data-down="1"] { background: var(--cut); }

  /* Полоски из прошлой демонстрации здесь нет: витрина — не базарный тент. */
  .band { display: none; }

  main { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s4) var(--s4) var(--s6); }

  nav { flex: none; display: flex; background: var(--card); border-top: 1px solid var(--line);
        padding-bottom: env(safe-area-inset-bottom, 0px); }
  nav button { flex: 1; background: none; border: 0; padding: var(--s2) var(--s1) var(--s3);
               display: flex; flex-direction: column; align-items: center; gap: 3px;
               font-size: 11.5px; font-weight: 500; color: var(--ink-3);
               border-top: 2px solid transparent; margin-top: -1px; transition: color .15s; }
  nav button[aria-selected="true"] { color: var(--brand); border-top-color: var(--brand); font-weight: 600; }
  nav svg { width: 21px; height: 21px; }

  h2 { font-size: 13px; font-weight: 600; letter-spacing: .01em; color: var(--ink-2);
       margin: var(--s5) 0 var(--s2); padding-bottom: 5px; border-bottom: 1px solid var(--line); }
  h2:first-child { margin-top: 0; }
  p { margin: 0 0 var(--s2); }
  .q  { color: var(--ink-2); font-size: 13.5px; }
  .q2 { color: var(--ink-3); font-size: 12.5px; }
  .hint { color: var(--ink-2); font-size: 13.5px; margin-bottom: var(--s4); max-width: 68ch; }

  /* ----------------------------------------------- лента строк, без карточек */
  .rows { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 0 var(--s3); }
  .row { display: flex; align-items: center; gap: var(--s3); padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .row .t { font-size: 14.5px; font-weight: 500; }
  .row .amt { font-family: var(--num); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ------------------------------------------------------------- товар */
  .goods { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: var(--s2); }
  .good {
    text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 10px; min-height: 82px; display: flex; flex-direction: column; gap: 3px;
    transition: border-color .15s, background .15s;
  }
  .good:hover:not(:disabled) { border-color: var(--brand); }
  .good:disabled { opacity: .45; cursor: not-allowed; }
  .good .t { font-size: 13px; font-weight: 500; line-height: 1.3; }
  .good .p { margin-top: auto; font-family: var(--num); font-size: 15px; font-weight: 700; }
  .good .s { font-family: var(--num); font-size: 11.5px; color: var(--ink-3); }

  /* -------------------------------------------------------------- чек */
  .till { flex: none; background: var(--card); border-top: 1px solid var(--edge); padding: var(--s3) var(--s4); }
  .till-head { display: flex; align-items: baseline; gap: var(--s3); }
  .till-head .lines { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left;
                      color: var(--ink-2); font-size: 13px; }
  .till-head .gross { font-family: var(--num); font-size: 14px; color: var(--ink-2); }
  .till-head .gross.struck { text-decoration: line-through; text-decoration-color: var(--cut); }

  .due { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s3); margin-top: var(--s2); }
  .due .lbl { font-size: 13px; color: var(--ink-2); padding-bottom: 6px; }
  .due .amt { font-family: var(--num); font-weight: 700; font-size: 40px; line-height: 1;
              letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
  .due .amt.settle { animation: settle .28s cubic-bezier(.16, 1, .3, 1); }
  @keyframes settle { from { opacity: .3; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .sell { display: flex; align-items: center; justify-content: center; gap: var(--s2);
          width: 100%; min-height: 52px; margin-top: var(--s3);
          border: 0; border-radius: var(--r); background: var(--brand); color: var(--on-brand);
          font-size: 16px; font-weight: 600; transition: background .15s; }
  .sell:hover { background: color-mix(in srgb, var(--brand) 86%, #000); }
  .sell svg { width: 19px; height: 19px; }

  /* ------------------------------------------------------------ кнопки */
  .btn { display: flex; align-items: center; justify-content: center; gap: var(--s2); width: 100%;
         min-height: var(--tap); border: 1px solid var(--brand); border-radius: var(--r);
         background: var(--brand); color: var(--on-brand); font-size: 15px; font-weight: 600;
         margin-top: var(--s3); transition: background .15s, border-color .15s; }
  .btn:hover { background: color-mix(in srgb, var(--brand) 86%, #000); }
  .btn.line { background: var(--card); color: var(--ink); border-color: var(--edge); }
  .btn.line:hover { border-color: var(--brand); background: var(--card); }
  .btn.warn { background: var(--alarm); border-color: var(--alarm); color: #fff; }
  .btn[disabled] { opacity: .4; cursor: not-allowed; }
  .btn svg { width: 17px; height: 17px; }

  .cuts { display: flex; gap: 6px; }
  .cut { flex: 1; min-height: var(--tap); border: 1px solid var(--edge); background: var(--card);
         border-radius: var(--r); font-family: var(--num); font-size: 14px; font-weight: 500;
         transition: background .15s, color .15s, border-color .15s; }
  .cut:hover { border-color: var(--brand); }
  .cut[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }

  .chipsrow { display: flex; flex-wrap: wrap; gap: 6px; }
  .chipx { border: 1px solid var(--edge); background: var(--card); color: var(--ink-2);
           border-radius: var(--r); padding: 8px 12px; min-height: var(--tap);
           font-family: var(--num); font-size: 14px; transition: border-color .15s; }
  .chipx:hover { border-color: var(--cut); }
  .chipx[aria-pressed="true"] { border-color: var(--cut); color: var(--cut); font-weight: 600;
                                background: color-mix(in srgb, var(--cut) 8%, transparent); }

  .stepper { display: flex; align-items: center; gap: 2px; }
  .stepper button { width: 36px; height: 36px; border: 1px solid var(--edge); background: var(--card);
                    border-radius: var(--r); display: grid; place-items: center; padding: 0; }
  .stepper button:hover { border-color: var(--brand); }
  .stepper button svg { width: 14px; height: 14px; }
  .stepper .v { min-width: 28px; text-align: center; font-family: var(--num); font-weight: 600; }

  .plain { background: none; border: 0; padding: 0; text-align: left; width: 100%; }
  .less { width: 26px; height: 26px; border: 1px solid var(--edge); background: var(--card);
          border-radius: var(--r); display: grid; place-items: center; padding: 0; flex: none; }
  .less svg { width: 13px; height: 13px; }
  .ok { width: 26px; height: 26px; border: 1px solid var(--edge); background: var(--card);
        border-radius: var(--r); display: grid; place-items: center; padding: 0; flex: none; }
  .ok[aria-pressed="true"] { background: var(--money); border-color: var(--money); color: #fff; }
  .ok svg { width: 15px; height: 15px; stroke-width: 2.4; }

  /* -------------------------------------------------------------- метки */
  .tag { display: inline-flex; align-items: center; border-radius: var(--r); padding: 2px 7px;
         font-size: 11.5px; font-weight: 600; white-space: nowrap; border: 1px solid;
         /* Не сжимается и не ужимается до нуля: соседняя колонка с flex: 1
            иначе забирает всю ширину, и длинная подпись обрезается. */
         flex: none; min-width: max-content; }
  .tag.ok { color: var(--money); border-color: color-mix(in srgb, var(--money) 40%, transparent);
            background: color-mix(in srgb, var(--money) 8%, transparent); }
  .tag.wt { color: var(--cut); border-color: color-mix(in srgb, var(--cut) 40%, transparent);
            background: color-mix(in srgb, var(--cut) 8%, transparent); }
  .tag.nt { color: var(--ink-2); border-color: var(--line); background: var(--sunk); }

  /* ------------------------------------------------------------- итоги */
  .figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line);
             border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .figure { background: var(--card); padding: 10px var(--s3); }
  .figure b { display: block; font-family: var(--num); font-weight: 700; font-size: 18px;
              letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .figure span { font-size: 11.5px; color: var(--ink-2); }

  .ledger { margin-top: var(--s3); padding-top: var(--s2); border-top: 1px solid var(--edge); }
  .ledger div { display: flex; justify-content: space-between; gap: var(--s3); padding: 3px 0; }
  .ledger .n { font-size: 14px; }
  .ledger .big { font-family: var(--num); font-weight: 700; font-size: 26px; letter-spacing: -.035em;
                 font-variant-numeric: tabular-nums; }
  .ledger .off { color: var(--cut); font-weight: 600; }

  /* -------------------------------------------------------------- поля */
  .fld { display: block; margin-bottom: var(--s3); }
  .fld > span { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 4px; }
  /* Строка ввода рядом с кнопками-подсказками — тот же вид, что у полей. */
  .fld input, .fld select, .fld textarea, input.plainfld {
    width: 100%; background: var(--card); border: 1px solid var(--edge);
    border-radius: var(--r); padding: 11px var(--s3); font-size: 16px;
  }
  .fld input:focus, .fld select:focus, .fld textarea:focus,
  input.plainfld:focus { border-color: var(--brand); outline: none; }
  .fld input[type="number"], .fld input.n { font-family: var(--num); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }

  .search { display: flex; align-items: center; gap: var(--s2); background: var(--card);
            border: 1px solid var(--edge); border-radius: var(--r); padding: 0 var(--s3); margin-bottom: var(--s3); }
  .search svg { color: var(--ink-3); flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; background: none; padding: 11px 0; font-size: 16px; }
  .search input:focus { outline: none; }
  .search .plain { width: auto; flex: none; color: var(--ink-3); display: grid; place-items: center; }

  .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .pill-f { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--edge);
            background: var(--card); color: var(--ink-2); border-radius: var(--r);
            padding: 7px 12px; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .pill-f span { font-family: var(--num); color: var(--ink-3); }
  .pill-f[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
  .pill-f[aria-pressed="true"] span { color: var(--on-brand); opacity: .75; }

  /* ------------------------------------------------------------ сканер */
  .scanbox { border: 1px dashed var(--edge); border-radius: var(--r); background: var(--card);
             padding: var(--s5) var(--s4); text-align: center; }
  .scanbox.live { border-style: solid; border-color: var(--money); }
  .scanbox .big { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .scanbox .sub { color: var(--ink-2); font-size: 13px; margin-top: 3px; }
  .scanbox svg { width: 30px; height: 30px; color: var(--ink-3); }
  .scanbox.live svg { color: var(--money); }

  /* -------------------------------------------------------------- листы */
  .veil { position: fixed; inset: 0; z-index: 60; background: rgba(14, 22, 32, .5);
          display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 520px; max-height: 92%; overflow-y: auto; background: var(--glass);
           border-radius: var(--r) var(--r) 0 0; border-top: 3px solid var(--brand);
           padding: var(--s3) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom, 0px)); }
  .grip { width: 36px; height: 3px; border-radius: 99px; background: var(--edge); margin: 0 auto var(--s3); }
  /* Кнопки под длинным списком: иначе до них надо прокручивать. */
  .stick { position: sticky; bottom: calc(-1 * var(--s5)); background: var(--glass);
           padding-top: var(--s3); margin-top: var(--s3); border-top: 1px solid var(--edge); }
  .sheet h3 { font-size: 18px; font-weight: 600; letter-spacing: -.015em; margin: 0 0 var(--s3); }

  /* ------------------------------------------------------------- бумага */
  .sheetpaper { background: #fff; color: #16191a; border: 1px solid #d8dad6; border-radius: var(--r);
                padding: var(--s4); font-size: 13px; line-height: 1.5; }
  .sheetpaper h4 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .sheetpaper .meta { color: #6a706c; font-size: 11.5px; font-family: var(--num); }
  .sheetpaper table { width: 100%; border-collapse: collapse; margin: var(--s3) 0;
                      font-variant-numeric: tabular-nums; }
  .sheetpaper th, .sheetpaper td { text-align: left; padding: 5px 4px; border-bottom: 1px solid #e7e9e6; }
  .sheetpaper th { font-size: 11.5px; font-weight: 600; color: #6a706c; }
  .sheetpaper .r { text-align: right; font-family: var(--num); }
  .sheetpaper .sign { display: flex; gap: var(--s4); margin-top: var(--s5); font-size: 11.5px; color: #6a706c; }
  .sheetpaper .sign > div { flex: 1; border-top: 1px solid #b9bdb9; padding-top: 4px; }

  .aside { border-left: 2px solid var(--brand); background: var(--card); padding: 10px var(--s3);
           font-size: 13px; color: var(--ink-2); border-radius: 0 var(--r) var(--r) 0; margin-top: var(--s3); }

  .flash { position: fixed; left: var(--s4); right: var(--s4); z-index: 80; margin: 0 auto; max-width: 440px;
           bottom: calc(var(--s4) + env(safe-area-inset-bottom, 0px));
           background: var(--ink); color: var(--glass); border-radius: var(--r); padding: 12px var(--s3);
           font-size: 14px; font-weight: 500; text-align: center; }

  /* ------------------------------------------------------ за прилавком */
  @media (min-width: 900px) {
    .desk > header { order: 0; }
    .desk > nav    { order: 1; border-top: 0; border-bottom: 1px solid var(--line); padding-bottom: 0;
                     background: var(--card); }
    .desk > main   { order: 2; padding: var(--s5) var(--s5) var(--s6); }
    .desk > .till  { order: 3; display: none; }

    .desk > nav button { flex: 0 0 auto; flex-direction: row; gap: 7px; padding: 11px 20px;
                         font-size: 14px; border-top: 0; border-bottom: 2px solid transparent; margin-top: 0; }
    .desk > nav button[aria-selected="true"] { border-bottom-color: var(--brand); }

    .two-pane { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: var(--s5); align-items: start; }
    .two-pane > * { min-width: 0; }
    .pane-right { position: sticky; top: var(--s4); }
  }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ------------------------------------------------------------ графики */
  .chart { background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
           padding: var(--s3) var(--s3) var(--s2); position: relative; }
  .chart h3 { font-size: 14px; font-weight: 600; margin: 0 0 2px; letter-spacing: -.01em; }
  .chart .lead { color: var(--ink-2); font-size: 12.5px; margin: 0 0 var(--s3); }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }

  /* Общее правило для значков задаёт обводку всем svg — графикам она
     рисует лишние вертикальные линии по краям прямоугольников. */
  .chart svg rect, .chart svg text { stroke: none; }
  .chart .grid-line { stroke: var(--grid); stroke-width: 1; }
  .chart .axis { fill: var(--ink-3); font-size: 10.5px; font-family: var(--num); }
  .chart .axis-name { fill: var(--ink-2); font-size: 11px; }
  /* Зазор между долями столбца: без него они сливаются в одно пятно. */
  .chart .seg { stroke: var(--card); stroke-width: 2; }
  .chart .hit { fill: transparent; cursor: pointer; }
  .chart .hit:hover ~ .cap, .chart .bar-group:hover .cap { opacity: 1; }
  .chart .value { fill: var(--ink); font-size: 11px; font-weight: 600; font-family: var(--num); }

  .legend { display: flex; flex-wrap: wrap; gap: var(--s3); margin-top: var(--s2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
  .legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }

  .tip { position: absolute; z-index: 5; pointer-events: none; background: var(--ink); color: var(--glass);
         border-radius: var(--r); padding: 7px 9px; font-size: 12px; line-height: 1.4; white-space: nowrap;
         transform: translate(-50%, -115%); opacity: 0; transition: opacity .1s; }
  .tip.on { opacity: 1; }
  .tip b { font-family: var(--num); }

  /* --------------------------------------------------------------- вход */
  .lock { position: fixed; inset: 0; z-index: 90; background: var(--glass);
          display: grid; place-items: center; padding: var(--s4); }
  .lock-card { width: 100%; max-width: 360px; text-align: center; }
  .lock-card h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; letter-spacing: -.02em; }
  .lock-card p { color: var(--ink-2); font-size: 13.5px; margin: 0 0 var(--s5); }
  .lock-who { display: flex; gap: var(--s2); margin-bottom: var(--s4); }
  .lock-who button { flex: 1; min-height: 52px; border: 1px solid var(--edge); background: var(--card);
                     border-radius: var(--r); font-size: 15px; font-weight: 500; }
  .lock-who button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
  .pin { display: flex; justify-content: center; gap: var(--s2); margin-bottom: var(--s4); }
  .pin i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--edge); display: block; }
  .pin i[data-on="1"] { background: var(--brand); border-color: var(--brand); }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); }
  .keys button { min-height: 58px; border: 1px solid var(--edge); background: var(--card);
                 border-radius: var(--r); font-family: var(--num); font-size: 21px; font-weight: 500; }
  .keys button:hover { border-color: var(--brand); }
  .keys button.wide { grid-column: span 1; font-family: var(--ui); font-size: 14px; }

<script>
/**
 * Три недели продаж задним числом.
 *
 * Выдумано, но по правилам живого магазина: к вечеру оживлённее,
 * в выходные больше, телефон берут редко и дорого, мелочь — часто
 * и помногу. Числа повторяемые: иначе графики прыгали бы при каждом
 * открытии и верить им было бы нельзя.
 */
function makeHistory() {
  let seed = 20261003;
  const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
  const pick = (list) => list[Math.floor(rnd() * list.length)];

  const phones = ['g1', 'g2', 'g3'];
  const small = ['g4', 'g5', 'g6', 'g7', 'g8', 'g9', 'g10'];
  const out = [];

  for (let back = 21; back >= 1; back -= 1) {
    const day = new Date();
    day.setDate(day.getDate() - back);
    const weekend = day.getDay() === 0 || day.getDay() === 6;
    const count = Math.round((weekend ? 9 : 6) + rnd() * 5);

    for (let i = 0; i < count; i += 1) {
      // Торговля идёт с десяти до восьми, под вечер плотнее.
      const hour = 10 + Math.floor(Math.pow(rnd(), 0.75) * 10);
      const at = new Date(day);
      at.setHours(hour, Math.floor(rnd() * 60), 0, 0);

      const want = [];
      if (rnd() < 0.22) want.push(pick(phones));
      const extras = 1 + Math.floor(rnd() * 2);
      for (let k = 0; k < extras; k += 1) want.push(pick(small));

      let total = 0;
      let cost = 0;
      let off = 0;
      const lines = [];

      for (const id of [...new Set(want)]) {
        const g = SEED.goods.find((x) => x.id === id);
        const qty = small.includes(id) && rnd() < 0.3 ? 2 : 1;
        // Скидку дают на дорогое, на мелочь — редко.
        const cut = phones.includes(id) && rnd() < 0.5
          ? Math.round((300 + rnd() * 1700) / 50) * 50
          : rnd() < 0.12 ? 50 : 0;
        lines.push({ name: g.name, price: g.price, qty, off: cut });
        total += g.price * qty - cut;
        cost += g.cost * qty;
        off += cut;
      }

      out.push({
        id: `h${back}-${i}`,
        at: at.getTime(),
        by: rnd() < 0.7 ? 'Кассир' : 'Владелец',
        total,
        cost,
        off,
        lines,
      });
    }
  }

  return out.sort((a, b) => a.at - b.at);
}

</script>
<script>
/**
 * Графики отчёта.
 *
 * Рисуются своим кодом в SVG, без библиотек: три простые формы не стоят
 * ста килобайт зависимости, которую потом нельзя открыть без интернета.
 *
 * Цвета рядов проверены скриптом на различимость при дальтонизме,
 * контраст с фоном и полосу светлоты — в обеих темах. Доли столбца
 * дополнительно разделены зазором и всегда лежат в одном порядке:
 * цвет здесь не единственный признак.
 */

const PLOT = { w: 760, h: 200, top: 16, right: 8, bottom: 26, left: 52 };

const money0 = (v) => new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 }).format(Math.round(v));

/** Короткая подпись оси: 12 400 → 12 т. */
function tick(v) {
  if (v >= 1000) return `${Math.round(v / 1000)} т`;
  return String(Math.round(v));
}

/**
 * Верхняя граница шкалы: круглое число над максимумом и обязательно
 * кратное четырём делениям — иначе подписи выходят вроде «188 т»,
 * по которым ничего не прикинешь на глаз.
 */
function ceilNice(max) {
  if (max <= 0) return 4;
  const order = Math.pow(10, Math.floor(Math.log10(max / 4)));
  for (const mult of [1, 2, 2.5, 5, 10]) {
    const step = order * mult;
    if (step * 4 >= max) return step * 4;
  }
  return order * 40;
}

function axisY(max, w, h, top, left) {
  const lines = [];
  for (let i = 0; i <= 4; i += 1) {
    const value = (max / 4) * i;
    const y = top + h - (h * i) / 4;
    lines.push(`<line class="grid-line" x1="${left}" y1="${y}" x2="${left + w}" y2="${y}"/>`);
    lines.push(`<text class="axis" x="${left - 8}" y="${y + 3.5}" text-anchor="end">${tick(value)}</text>`);
  }
  return lines.join('');
}

/**
 * Выручка по дням, столбец разложен на себестоимость и прибыль.
 *
 * Высота столбца — выручка, верхняя доля — то, что осталось магазину.
 * Две линии вместо этого показали бы те же числа, но спрятали главное:
 * прибыль — часть выручки, а не отдельная величина.
 */
function chartDays(checks, days = 14) {
  const buckets = [];
  for (let back = days - 1; back >= 0; back -= 1) {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - back);
    const next = d.getTime() + 24 * 3600e3;
    const inDay = checks.filter((c) => c.at >= d.getTime() && c.at < next);
    buckets.push({
      date: d,
      revenue: inDay.reduce((s, c) => s + c.total, 0),
      cost: inDay.reduce((s, c) => s + c.cost, 0),
      count: inDay.length,
    });
  }

  const max = ceilNice(Math.max(...buckets.map((b) => b.revenue), 1));
  const { w, h, top, left, bottom } = PLOT;
  const plotW = w - left - PLOT.right;
  const band = plotW / buckets.length;
  const barW = Math.min(26, band * 0.62);

  const bars = buckets.map((b, i) => {
    const x = left + band * i + (band - barW) / 2;
    const hCost = (b.cost / max) * h;
    const hProfit = ((b.revenue - b.cost) / max) * h;
    const yCost = top + h - hCost;
    const yProfit = yCost - hProfit;
    const label = b.date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });

    return `<g class="bar-group"
      data-tip="${label}: выручка ${money0(b.revenue)} с, прибыль ${money0(b.revenue - b.cost)} с, чеков ${b.count}">
      ${hProfit > 0.5 ? `<rect class="seg" x="${x}" y="${yProfit}" width="${barW}" height="${hProfit}"
        rx="3" fill="var(--mark-2)"/>` : ''}
      ${hCost > 0.5 ? `<rect class="seg" x="${x}" y="${yCost}" width="${barW}" height="${hCost}"
        fill="var(--mark-1)"/>` : ''}
      <rect class="hit" x="${left + band * i}" y="${top}" width="${band}" height="${h}"/>
    </g>`;
  }).join('');

  // Подписи по оси времени не на каждом столбце: иначе они сольются.
  const marks = buckets.map((b, i) => {
    const every = buckets.length > 10 ? 3 : 1;
    if (i % every !== 0 && i !== buckets.length - 1) return '';
    const x = left + band * i + band / 2;
    return `<text class="axis" x="${x}" y="${top + h + 16}" text-anchor="middle">${
      b.date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' })}</text>`;
  }).join('');

  return `
    <div class="chart">
      <h3>Выручка по дням</h3>
      <p class="lead">Высота столбца — выручка за день. Зелёным сверху — что осталось магазину.</p>
      <svg viewBox="0 0 ${w} ${h + top + bottom}" role="img"
           aria-label="Выручка и прибыль по дням за ${days} дней">
        ${axisY(max, w - left - PLOT.right, h, top, left)}
        ${bars}
        ${marks}
      </svg>
      <div class="legend">
        <span><i style="background:var(--mark-2)"></i>прибыль</span>
        <span><i style="background:var(--mark-1)"></i>себестоимость</span>
      </div>
    </div>`;
}

/** Когда в магазин заходят: по этому графику ставят людей в смену. */
function chartHours(checks) {
  const from = 9;
  const to = 21;
  const hours = [];
  for (let hour = from; hour <= to; hour += 1) {
    const inHour = checks.filter((c) => new Date(c.at).getHours() === hour);
    hours.push({ hour, count: inHour.length, sum: inHour.reduce((s, c) => s + c.total, 0) });
  }

  const max = ceilNice(Math.max(...hours.map((x) => x.count), 1));
  const h = 140;
  const top = 14;
  const left = 38;
  const w = PLOT.w;
  const plotW = w - left - PLOT.right;
  const band = plotW / hours.length;
  const barW = Math.min(30, band * 0.66);
  const busiest = hours.reduce((a, b) => (b.count > a.count ? b : a), hours[0]);

  const bars = hours.map((x, i) => {
    const bh = (x.count / max) * h;
    const bx = left + band * i + (band - barW) / 2;
    const by = top + h - bh;
    return `<g class="bar-group" data-tip="${x.hour}:00 — ${x.count} чеков на ${money0(x.sum)} с">
      ${bh > 0.5 ? `<rect class="seg" x="${bx}" y="${by}" width="${barW}" height="${bh}" rx="3"
        fill="var(--mark-1)" opacity="${x.hour === busiest.hour ? 1 : 0.72}"/>` : ''}
      ${x.hour === busiest.hour
        ? `<text class="value" x="${bx + barW / 2}" y="${by - 6}" text-anchor="middle">${x.count}</text>`
        : ''}
      <rect class="hit" x="${left + band * i}" y="${top}" width="${band}" height="${h}"/>
    </g>`;
  }).join('');

  const marks = hours.map((x, i) => (x.hour % 2 === 0
    ? `<text class="axis" x="${left + band * i + band / 2}" y="${top + h + 16}" text-anchor="middle">${x.hour}</text>`
    : '')).join('');

  return `
    <div class="chart">
      <h3>Когда покупают</h3>
      <p class="lead">Чеков по часам за три недели. Самый плотный час подписан.</p>
      <svg viewBox="0 0 ${w} ${h + top + 26}" role="img" aria-label="Число чеков по часам">
        ${axisY(max, plotW, h, top, left)}
        ${bars}
        ${marks}
        <text class="axis-name" x="${left}" y="${top + h + 26}">час дня</text>
      </svg>
    </div>`;
}

/** Что берут: выручка по товарам, полосами вниз по убыванию. */
function chartTop(checks, limit = 6) {
  const sums = new Map();
  for (const c of checks) {
    for (const l of c.lines) {
      const prev = sums.get(l.name) ?? { sum: 0, qty: 0 };
      sums.set(l.name, { sum: prev.sum + l.price * l.qty - l.off, qty: prev.qty + l.qty });
    }
  }
  const rows = [...sums.entries()]
    .map(([name, v]) => ({ name, ...v }))
    .sort((a, b) => b.sum - a.sum)
    .slice(0, limit);

  if (rows.length === 0) return '';

  const max = Math.max(...rows.map((r) => r.sum));
  const rowH = 30;
  const left = 0;
  const w = PLOT.w;
  const barLeft = 230;
  const barW = w - barLeft - 90;

  const bars = rows.map((r, i) => {
    const y = i * rowH;
    const len = Math.max(2, (r.sum / max) * barW);
    return `<g class="bar-group" data-tip="${r.name}: ${r.qty} шт на ${money0(r.sum)} с">
      <text class="axis" x="${left}" y="${y + 19}" style="font-family:var(--ui);fill:var(--ink)">${
        r.name.length > 26 ? r.name.slice(0, 25) + '…' : r.name}</text>
      <rect x="${barLeft}" y="${y + 8}" width="${len}" height="14" rx="3" fill="var(--mark-1)"/>
      <text class="value" x="${barLeft + len + 8}" y="${y + 19}">${money0(r.sum)}</text>
      <rect class="hit" x="0" y="${y}" width="${w}" height="${rowH}"/>
    </g>`;
  }).join('');

  return `
    <div class="chart">
      <h3>Что берут</h3>
      <p class="lead">Выручка по товару за три недели.</p>
      <svg viewBox="0 0 ${w} ${rows.length * rowH + 6}" role="img" aria-label="Выручка по товарам">
        ${bars}
      </svg>
    </div>`;
}

/**
 * Подсказка при наведении.
 *
 * Одна на весь отчёт: вешать обработчик на каждый столбец значит
 * пересоздавать их при каждой перерисовке.
 */
function wireTips(host) {
  if (!host) return;
  let tip = host.querySelector('.tip');
  if (!tip) {
    tip = document.createElement('div');
    tip.className = 'tip';
    host.appendChild(tip);
  }

  host.addEventListener('pointermove', (event) => {
    const group = event.target.closest('[data-tip]');
    if (!group) { tip.classList.remove('on'); return; }
    const box = host.getBoundingClientRect();
    tip.textContent = group.dataset.tip;
    tip.style.left = `${event.clientX - box.left}px`;
    tip.style.top = `${event.clientY - box.top - 6}px`;
    tip.classList.add('on');
  });

  host.addEventListener('pointerleave', () => tip.classList.remove('on'));
}

</script>
<script>
/**
 * Запись книги Excel.
 *
 * Своим кодом, без библиотек: файл .xlsx — это обычный zip с несколькими
 * файлами XML внутри, и складывать его без сжатия Excel разрешает.
 * Тянуть ради этого стороннюю библиотеку значило бы прибавить к странице
 * сотню килобайт и внешнюю загрузку, которой в офлайне не будет.
 *
 * Числа кладутся числами, а не строками: иначе в Excel по колонке не
 * посчитать сумму, и выгрузка превращается в картинку таблицы.
 */

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n += 1) {
    let c = n;
    for (let k = 0; k < 8; k += 1) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let c = 0xffffffff;
  for (const byte of bytes) c = CRC_TABLE[(c ^ byte) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

/** Zip без сжатия: короче кода и Excel такой читает. */
function zip(files) {
  const encoder = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;

  const u16 = (v) => [v & 255, (v >> 8) & 255];
  const u32 = (v) => [v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255];

  for (const { name, text } of files) {
    const nameBytes = encoder.encode(name);
    const body = encoder.encode(text);
    const sum = crc32(body);

    const local = [
      ...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
      ...u32(sum), ...u32(body.length), ...u32(body.length),
      ...u16(nameBytes.length), ...u16(0),
    ];
    parts.push(new Uint8Array(local), nameBytes, body);

    central.push([
      ...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
      ...u32(sum), ...u32(body.length), ...u32(body.length),
      ...u16(nameBytes.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
      ...u32(0), ...u32(offset),
      ...Array.from(nameBytes),
    ]);

    offset += local.length + nameBytes.length + body.length;
  }

  const dir = central.flat();
  const end = [
    ...u32(0x06054b50), ...u16(0), ...u16(0),
    ...u16(files.length), ...u16(files.length),
    ...u32(dir.length), ...u32(offset), ...u16(0),
  ];

  const total = offset + dir.length + end.length;
  const out = new Uint8Array(total);
  let at = 0;
  for (const part of parts) { out.set(part, at); at += part.length; }
  out.set(new Uint8Array(dir), at); at += dir.length;
  out.set(new Uint8Array(end), at);
  return out;
}

const xmlText = (v) => String(v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const colName = (i) => (i < 26 ? String.fromCharCode(65 + i) : String.fromCharCode(64 + Math.floor(i / 26)) + String.fromCharCode(65 + (i % 26)));

/**
 * Лист книги.
 * rows — массив массивов; число остаётся числом, остальное становится текстом.
 * Первая строка считается шапкой и выделяется жирным.
 */
function sheetXml(rows, widths) {
  const body = rows.map((row, r) => {
    const cells = row.map((value, c) => {
      const ref = `${colName(c)}${r + 1}`;
      const style = r === 0 ? ' s="1"' : '';
      if (typeof value === 'number' && Number.isFinite(value)) {
        return `<c r="${ref}"${style}><v>${value}</v></c>`;
      }
      return `<c r="${ref}"${style} t="inlineStr"><is><t xml:space="preserve">${xmlText(value ?? '')}</t></is></c>`;
    }).join('');
    return `<row r="${r + 1}">${cells}</row>`;
  }).join('');

  const cols = (widths ?? []).map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('');

  return `<?xml version="1.0" encoding="UTF-8"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
${cols ? `<cols>${cols}</cols>` : ''}
<sheetData>${body}</sheetData>
</worksheet>`;
}

/** Собирает книгу из листов вида { name, rows, widths }. */
function makeWorkbook(sheets) {
  const files = [
    {
      name: '[Content_Types].xml',
      text: `<?xml version="1.0" encoding="UTF-8"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}
</Types>`,
    },
    {
      name: '_rels/.rels',
      text: `<?xml version="1.0" encoding="UTF-8"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`,
    },
    {
      name: 'xl/workbook.xml',
      text: `<?xml version="1.0" encoding="UTF-8"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"

<script>
/**
 * Разбор торговли: что брать больше, что меньше, где лежат деньги.
 *
 * Все выводы — из чеков за три недели, и каждый подкреплён числом.
 * Совет без числа в рознице бесполезен: «берите больше чехлов» ничего
 * не говорит, а «чехлов хватит на четыре дня, берут по две штуки в день»
 * говорит, сколько заказать.
 */

const WINDOW_DAYS = 21;

/** Сводка по каждому товару за окно наблюдения. */
function goodsStats() {
  const since = Date.now() - WINDOW_DAYS * 24 * 3600e3;
  const sold = new Map();

  for (const check of data.checks) {
    if (check.at < since) continue;
    for (const line of check.lines) {
      const prev = sold.get(line.name) ?? { qty: 0, revenue: 0, off: 0 };
      sold.set(line.name, {
        qty: prev.qty + line.qty,
        revenue: prev.revenue + line.price * line.qty - line.off,
        off: prev.off + line.off,
      });
    }
  }

  return data.goods.map((g) => {
    const s = sold.get(g.name) ?? { qty: 0, revenue: 0, off: 0 };
    const perDay = s.qty / WINDOW_DAYS;
    const profit = s.qty * (g.price - g.cost) - s.off;
    return {
      good: g,
      qty: s.qty,
      revenue: s.revenue,
      profit,
      perDay,
      // На сколько дней хватит остатка при нынешнем спросе.
      daysLeft: perDay > 0 ? Math.floor(g.stock / perDay) : null,
      markup: g.cost > 0 ? Math.round(((g.price - g.cost) / g.cost) * 100) : 0,
      frozen: g.cost * g.stock,
    };
  });
}

/**
 * Выводы.
 *
 * Правила намеренно простые и проверяемые: каждое объясняется одной
 * фразой и опирается на видимое число. Сложная модель в демонстрации
 * выглядела бы умно и не позволяла бы спорить.
 */
function advice() {
  const rows = goodsStats();
  const sellers = rows.filter((r) => r.qty > 0);
  const totalProfit = rows.reduce((s, r) => s + r.profit, 0);
  const avgMarkup = sellers.length
    ? Math.round(sellers.reduce((s, r) => s + r.markup, 0) / sellers.length)
    : 0;

  const out = [];

  // 1. Кончается то, что хорошо берут.
  for (const r of rows
    .filter((r) => r.daysLeft !== null && r.daysLeft <= 7)
    .sort((a, b) => a.daysLeft - b.daysLeft)
    .slice(0, 3)) {
    const order = Math.max(1, Math.ceil(r.perDay * 14 - r.good.stock));
    out.push({
      kind: 'take',
      name: r.good.name,
      head: r.daysLeft === 0 ? 'Кончился, а берут' : `Хватит на ${r.daysLeft} ${plural(r.daysLeft, 'день', 'дня', 'дней')}`,
      why: `берут ${r.perDay >= 1 ? r.perDay.toFixed(1) : r.perDay.toFixed(2)} шт в день, на складе ${r.good.stock}`,
      what: `взять примерно ${order} шт — хватит на две недели`,
    });
  }

  // 2. Деньги, которые лежат без движения.
  for (const r of rows
    .filter((r) => r.qty === 0 && r.frozen >= 1000)
    .sort((a, b) => b.frozen - a.frozen)
    .slice(0, 3)) {
    out.push({
      kind: 'drop',
      name: r.good.name,
      head: 'Не продаётся совсем',
      why: `ни одной продажи за три недели, в остатке ${r.good.stock} шт`,
      what: `в нём лежит ${som(r.frozen)} — распродать со скидкой и больше не брать`,
    });
  }

  // 3. Берут часто, а зарабатываем мало — цена занижена.
  const busy = [...sellers].sort((a, b) => b.qty - a.qty).slice(0, 4);
  for (const r of busy.filter((r) => r.markup < avgMarkup && r.qty >= 5).slice(0, 2)) {
    const plus = Math.round(r.good.cost * 0.1);
    out.push({
      kind: 'price',
      name: r.good.name,
      head: 'Берут охотно, наценка ниже средней',
      why: `наценка ${r.markup}% против ${avgMarkup}% в среднем, продано ${r.qty} шт`,
      what: `поднять цену примерно на ${som(plus)} — спрос такое обычно выдерживает`,
    });
  }

  // 4. Наценка большая, а не берут — возможно, дорого.
  for (const r of rows
    .filter((r) => r.markup > avgMarkup * 1.5 && r.qty <= 1 && r.good.stock > 0)
    .sort((a, b) => b.markup - a.markup)
    .slice(0, 2)) {
    out.push({
      kind: 'slow',
      name: r.good.name,
      head: 'Наценка высокая, продаж почти нет',
      why: `наценка ${r.markup}%, за три недели продано ${r.qty} шт`,
      what: 'попробовать цену ниже: лучше заработать меньше, чем не заработать вовсе',
    });
  }

  // 5. На чём держится заработок.
  const top = [...sellers].sort((a, b) => b.profit - a.profit).slice(0, 3);
  if (top.length && totalProfit > 0) {
    const share = Math.round((top.reduce((s, r) => s + r.profit, 0) / totalProfit) * 100);
    out.push({
      kind: 'keep',
      name: top.map((r) => r.good.name).join(', '),
      head: `Эти три дают ${share}% всей прибыли`,
      why: top.map((r) => `${r.good.name.split(' ')[0]} ${som(r.profit)}`).join(', '),
      what: 'их нельзя допускать до нуля на складе — именно на них магазин живёт',
    });
  }

  return { rows, out, avgMarkup, totalProfit };
}

const ADVICE_LOOK = {
  take: { tag: 'wt', label: 'брать больше' },
  drop: { tag: 'nt', label: 'не брать' },
  price: { tag: 'ok', label: 'поднять цену' },
  slow: { tag: 'nt', label: 'снизить цену' },
  keep: { tag: 'ok', label: 'держать всегда' },
};

function viewAdvice() {
  const { out, avgMarkup } = advice();
  if (out.length === 0) {
    return '<h2>Что делать</h2><p class="q">Пока продаж мало — советовать не на чем.</p>';
  }

  return `
    <h2>Что делать</h2>
    <p class="q">Выводы из чеков за три недели. Средняя наценка по магазину — ${avgMarkup}%.</p>
    <div class="rows">
      ${out.map((a) => {
        const look = ADVICE_LOOK[a.kind];
        return `<div class="row" style="align-items:flex-start">
          <div class="grow">
            <div class="t">${esc(a.head)}</div>
            <div class="q2" style="margin:2px 0 4px">${esc(a.name)}</div>
            <div class="q2">${esc(a.why)}</div>
            <div class="t" style="font-weight:500;margin-top:4px">${esc(a.what)}</div>
          </div>
          <span class="tag ${look.tag}">${look.label}</span>
        </div>`;
      }).join('')}
    </div>`;
}

/* ------------------------------------------------------------- выгрузка */

/** Книга Excel со всем, что есть в системе. */
function buildWorkbook() {
  const { rows, out, avgMarkup } = advice();
  const checks = [...data.checks].sort((a, b) => a.at - b.at);
  const day = (ms) => new Date(ms).toLocaleDateString('ru-RU');
  const time = (ms) => new Date(ms).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

  const revenue = checks.reduce((s, c) => s + c.total, 0);
  const cost = checks.reduce((s, c) => s + c.cost, 0);

  const summary = [
    [`Отчёт магазина «${data.shopName}»`],
    ['Составлен', new Date().toLocaleString('ru-RU')],
    ['Период', `${day(checks[0]?.at ?? Date.now())} — ${day(checks.at(-1)?.at ?? Date.now())}`],
    [],
    ['Показатель', 'Значение'],
    ['Выручка, сом', revenue],
    ['Себестоимость проданного, сом', cost],
    ['Прибыль, сом', revenue - cost],
    ['Скидок дано, сом', checks.reduce((s, c) => s + c.off, 0)],
    ['Чеков', checks.length],
    ['Средний чек, сом', checks.length ? Math.round(revenue / checks.length) : 0],
    ['Средняя наценка, %', avgMarkup],
    ['Денег в товаре по закупу, сом', data.goods.reduce((s, g) => s + g.cost * g.stock, 0)],
    [],
    ['Что делать', 'Товар', 'Почему', 'Что именно'],
    ...out.map((a) => [ADVICE_LOOK[a.kind].label, a.name, a.why, a.what]),
  ];

  const goods = [
    ['Товар', 'Коды коробок', 'Закуп', 'Продажа', 'Наценка, %', 'Остаток',
     'Продано за 21 день', 'В день', 'Хватит на, дней', 'Выручка', 'Прибыль', 'Денег в остатке'],
    ...rows
      .sort((a, b) => b.profit - a.profit)
      .map((r) => [
        // Кодов у товара много — у телефонов свой на каждой коробке.
        // В книгу идут все: по ним потом находят, какая трубка ушла.
        r.good.name, (r.good.codes ?? []).join(' '), r.good.cost, r.good.price, r.markup, r.good.stock,
        r.qty, Number(r.perDay.toFixed(2)),
        r.daysLeft === null ? 'спроса нет' : r.daysLeft,
        r.revenue, r.profit, r.frozen,
      ]),
  ];

  const sales = [
    ['Дата', 'Время', 'Продал', 'Позиций', 'Сумма', 'Скидка', 'Себестоимость', 'Прибыль', 'Тип'],
    ...checks.map((c) => [
      day(c.at), time(c.at), c.by, c.lines.length, c.total, c.off, c.cost, c.total - c.cost,
      isReturn(c) ? 'возврат' : 'продажа',
    ]),
  ];

  const lines = [
    ['Дата', 'Время', 'Товар', 'Кол-во', 'Цена', 'Скидка', 'Сумма'],
    ...checks.flatMap((c) => c.lines.map((l) => [
      day(c.at), time(c.at), l.name, l.qty, l.price, l.off, l.price * l.qty - l.off,
    ])),
  ];

  const byDay = new Map();
  for (const c of checks) {
    const key = day(c.at);
    const prev = byDay.get(key) ?? { count: 0, revenue: 0, cost: 0, off: 0 };
    byDay.set(key, {
      count: prev.count + 1, revenue: prev.revenue + c.total,
      cost: prev.cost + c.cost, off: prev.off + c.off,
    });
  }
  const days = [
    ['Дата', 'Чеков', 'Выручка', 'Себестоимость', 'Прибыль', 'Скидки'],
    ...[...byDay.entries()].map(([d, v]) => [d, v.count, v.revenue, v.cost, v.revenue - v.cost, v.off]),
  ];

  const byHour = new Map();
  for (const c of checks) {
    const h = new Date(c.at).getHours();
    const prev = byHour.get(h) ?? { count: 0, revenue: 0 };
    byHour.set(h, { count: prev.count + 1, revenue: prev.revenue + c.total });
  }
  const hours = [
    ['Час', 'Чеков', 'Выручка'],
    ...[...byHour.entries()].sort((a, b) => a[0] - b[0]).map(([h, v]) => [`${h}:00`, v.count, v.revenue]),
  ];

  const shiftRows = [
    ['Открыта', 'Закрыта', 'Открыл(а)', 'Закрыл(а)', 'Чеков', 'Штук', 'Выручка', 'Себестоимость', 'Прибыль', 'Скидок', 'Возвраты', 'Средний чек'],
    ...data.shifts.map((r) => [
      new Date(r.from).toLocaleString('ru-RU'), new Date(r.to).toLocaleString('ru-RU'), r.openedBy ?? '', r.by,
      r.checks, r.units, r.revenue, r.cost, r.profit, r.off, r.refunds ?? 0, r.avg,
    ]),
  ];

  const intakeRows = [
    ['Дата', 'Время', 'Принял(а)', 'Товар', 'Кол-во', 'Тип', 'Код'],
    ...data.intakes.map((i) => [day(i.at), time(i.at), i.by, i.name, i.qty, INTAKE_KIND[i.kind] ?? i.kind, i.code ?? '']),
  ];

  const invRows = [
    ['Дата', 'Провёл(а)', 'Товар', 'По учёту', 'По факту', 'Разница', 'Сумма по закупу'],
    ...data.inventories.flatMap((r) => r.lines.map((l) => [
      `${day(r.at)} ${time(r.at)}`, r.by, l.name, l.was, l.now, l.diff, l.diff * l.cost,
    ])),
  ];

  return makeWorkbook([
    { name: 'Сводка', rows: summary, widths: [34, 16, 52, 52] },
    { name: 'Инвентаризации', rows: invRows, widths: [18, 16, 34, 10, 10, 10, 16] },
    { name: 'Приёмка', rows: intakeRows, widths: [12, 9, 16, 34, 9, 16, 18] },
    { name: 'Смены', rows: shiftRows, widths: [18, 18, 16, 16, 8, 8, 12, 14, 12, 10, 10, 12] },
    { name: 'Товары', rows: goods, widths: [30, 16, 10, 10, 11, 9, 18, 9, 15, 12, 12, 15] },
    { name: 'Продажи', rows: sales, widths: [12, 9, 12, 10, 12, 10, 15, 12, 10] },
    { name: 'Позиции чеков', rows: lines, widths: [12, 9, 30, 9, 11, 10, 12] },
    { name: 'По дням', rows: days, widths: [12, 9, 12, 15, 12, 10] },
    { name: 'По часам', rows: hours, widths: [9, 9, 12] },
  ]);
}

/**
 * Отдать книгу человеку.
 *
 * В программе на компьютере — положить файлом рядом с данными и открыть
 * папку. В браузере — обычной ссылкой на скачивание.
 */
function exportWorkbook() {
  const bytes = buildWorkbook();
  const stamp = new Date().toISOString().slice(0, 10);
  const name = `Отчёт магазина ${stamp}.xlsx`;

  if (typeof DESK !== 'undefined' && DESK && DESK.saveFile) {
    let binary = '';
    for (const byte of bytes) binary += String.fromCharCode(byte);
    const where = DESK.saveFile(name, btoa(binary));
    return where ? { ok: true, where } : { ok: false };
  }

  try {
    const blob = new Blob([bytes], {
      type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = name;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return { ok: true, where: name };
  } catch (error) {
    return { ok: false };
  }
}

/**
 * SHA-256 на чистом JS: код проверяется синхронно, а WebCrypto отвечает
 * обещанием, из-за чего пришлось бы переписывать весь вход.
 */
const SHA_K = new Uint32Array([
  0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
  0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
  0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
  0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
  0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
  0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
  0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
]);

function sha256(bytes) {
  const h = new Uint32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]);
  const len = bytes.length;
  const padded = new Uint8Array(((len + 9 + 63) >> 6) << 6);
  padded.set(bytes);
  padded[len] = 0x80;
  const view = new DataView(padded.buffer);
  view.setUint32(padded.length - 8, Math.floor((len * 8) / 0x100000000));
  view.setUint32(padded.length - 4, (len * 8) >>> 0);
  const w = new Uint32Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < padded.length; off += 64) {
    for (let i = 0; i < 16; i += 1) w[i] = view.getUint32(off + i * 4);
    for (let i = 16; i < 64; i += 1) {
      const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i += 1) {
      const t1 = (hh + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + SHA_K[i] + w[i]) >>> 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h[0] += a; h[1] += b; h[2] += c; h[3] += d; h[4] += e; h[5] += f; h[6] += g; h[7] += hh;
  }
  const out = new Uint8Array(32);
  const o = new DataView(out.buffer);
  for (let i = 0; i < 8; i += 1) o.setUint32(i * 4, h[i]);
  return out;
}

const toHex = (bytes) => [...bytes].map((b) => b.toString(16).padStart(2, '0')).join('');
const fromHex = (hex) => Uint8Array.from(hex.match(/../g) ?? [], (x) => parseInt(x, 16));

/** Сколько раз перемешиваем: каждая проверка кода стоит заметного времени. */
const PIN_ROUNDS = 30000;

/** Хеш кода с солью: `x = sha256(соль + код)`, затем много раз `sha256(x + соль + код)`. */
function pinDigest(code, saltHex) {
  const salt = fromHex(saltHex);
  const pinBytes = new TextEncoder().encode(String(code));
  const join = (...parts) => {
    const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
    let at = 0;
    for (const part of parts) { out.set(part, at); at += part.length; }
    return out;
  };
  let x = sha256(join(salt, pinBytes));
  for (let i = 0; i < PIN_ROUNDS; i += 1) x = sha256(join(x, salt, pinBytes));
  return toHex(x);
}

/** Запись для файла: код открытым текстом там не лежит. */
function pinPack(code) {
  const salt = toHex(crypto.getRandomValues(new Uint8Array(16)));
  return `v1:${salt}:${pinDigest(code, salt)}`;
}

function pinMatches(code, packed) {
  const [version, salt, digest] = String(packed ?? '').split(':');
  if (version !== 'v1' || !salt || !digest) return false;
  const got = pinDigest(code, salt);
  // Сравниваем целиком, без раннего выхода: время ответа не выдаёт верные цифры.
  let diff = got.length ^ digest.length;
  for (let i = 0; i < got.length; i += 1) diff |= got.charCodeAt(i) ^ (digest.charCodeAt(i) || 0);
  return diff === 0;
}

/** Пять промахов подряд — ждём; каждые следующие пять ждать вдвое дольше, до 15 минут. */
const PIN_TRIES = 5;
function pinWait() {
  const lock = data.pinLock;
  return lock && lock.until > Date.now() ? Math.ceil((lock.until - Date.now()) / 1000) : 0;
}
function pinFailed() {
  const fails = (data.pinLock?.fails ?? 0) + 1;
  const wait = fails % PIN_TRIES === 0
    ? Math.min(15 * 60, 60 * 2 ** (fails / PIN_TRIES - 1)) * 1000
    : 0;
  data.pinLock = { fails, until: wait ? Date.now() + wait : 0 };
  save();
  return wait;
}

/** Прежняя версия хранила код открытым текстом; при чтении он заменяется хешем. */

/** Кого пускаем с этим набором цифр. null — никого. */

  if (ownerSetup()) return null;
  if (!pinMatches(value, data.accounts.owner)) return null;
  data.pinLock = null;
  return 'owner';
}

/** Ввод четырёх цифр на входе владельца: пустить, отказать или попросить подождать. */

  pin = '';
  render();
  if (now) return flash(`Код не подошёл. Следующая попытка через ${Math.round(now / 1000)} с`);
  const left = PIN_TRIES - ((data.pinLock?.fails ?? 0) % PIN_TRIES);
  return flash(`Код не подошёл. Осталось попыток: ${left}`);
}

/** Пустить внутрь и поздороваться. */

/**

/**
 * Приведение сохранённого к нынешнему виду.

 * Раньше у товара был один штрих-код. С телефонами так не выходит —
 * код на каждой коробке свой, — и поле стало списком. Данные, записанные

/**
 * Штучный товар: код на каждой коробке свой (IMEI), и коробку можно
 * продать один раз. Телефоны узнаются по памяти в названии, а ещё по
 * тому, что у модели уже больше одного кода. Чехлы и стёкла — один код
 * на все штуки, их пикают сколько нужно, пока есть остаток.
 */
const isSerial = (g) => !!(g.mem || g.ram) || g.codes.length > 1;

function fixUp(d) {
  for (const g of d.goods ?? []) {
    if (!Array.isArray(g.codes)) g.codes = g.code ? [String(g.code)] : [];
    delete g.code;
    if (!g.model) g.model = g.name;
    // Телефоны и прочее с памятью — штучный товар, код на каждой коробке свой.
  }
  if (typeof d.limitOn !== 'boolean') d.limitOn = true;
  if (!d.accounts || typeof d.accounts !== 'object') d.accounts = { owner: '', cashier: '' };
  if (/^\d{4}$/.test(String(d.accounts.owner ?? ''))) {
    d.accounts.owner = pinPack(d.accounts.owner);
    pinMigrated = true;
  }
  if (!d.pinLock || typeof d.pinLock.fails !== 'number') d.pinLock = null;
  if (!Array.isArray(d.intakes)) d.intakes = [];
  if (typeof d.shopName !== 'string' || !d.shopName.trim()) d.shopName = 'Телефоны и чехлы';
  if (!Array.isArray(d.inventories)) d.inventories = [];
  if (!d.invDraft || typeof d.invDraft.counts !== 'object') d.invDraft = null;
  if (!Array.isArray(d.staff)) d.staff = [];
  if (!d.sold || typeof d.sold !== 'object') d.sold = {};
  if (!Array.isArray(d.shifts)) d.shifts = [];
  if (typeof d.shiftStart !== 'number') d.shiftStart = null;
  if (!d.shiftOpen || typeof d.shiftOpen.at !== 'number') d.shiftOpen = null;
  // Что продано до этой перемены, тоже считается проданным.
  const штучные = new Set((d.goods ?? []).filter(isSerial).map((g) => g.name));
  for (const c of d.checks ?? []) {
    // Чек возврата ничего не продаёт: его строки не делают коробку проданной.
    if (c.kind === 'return') continue;
    for (const l of c.lines ?? []) {
      if (!штучные.has(l.name)) continue;
      // Возвращённая коробка снова в продаже, её проданной считать нельзя.
      for (const code of l.codes ?? []) {

  const base = structuredClone(SEED);

function load() {
  if (DESK) {
    const saved = DESK.load();
    return fixUp(saved ? { ...startState(), ...saved } : startState());
  }
  try { const raw = localStorage.getItem(KEY); if (raw) return fixUp({ ...startState(), ...JSON.parse(raw) }); }
  catch (e) { /* приватное окно */ }
  return fixUp(startState());
}

  if (DESK) return DESK.save(data);

  const hundred = n % 100;
  const word = last === 1 && hundred !== 11 ? 'код'
    : last >= 2 && last <= 4 && (hundred < 12 || hundred > 14) ? 'кода'
    : 'кодов';
  return `${n} ${word} с коробок`;
}
const markup = (g) => (g.cost > 0 ? Math.round(((g.price - g.cost) / g.cost) * 100) : 0);

function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

function flash(text) {
  const host = document.getElementById('flash');
  host.innerHTML = `<div class="flash">${esc(text)}</div>`;
  clearTimeout(flash.t);
  flash.t = setTimeout(() => { host.innerHTML = ''; }, 2400);
}

function total() {
  let gross = 0, off = 0, cost = 0, count = 0;
  for (const l of check) {
    const g = good(l.id);
    if (!g) continue;
    gross += g.price * l.qty;
    off += l.off;
    cost += g.cost * l.qty;
    count += l.qty;
  }
  // Скидка на весь чек прибавляется к построчным и не уводит «к оплате»
  // ниже нуля: отдавать товар с доплатой покупателю никто не собирался.
  const whole = Math.min(checkOff, Math.max(0, gross - off));
  off += whole;
  return { gross, off, whole, due: gross - off, cost, count, profit: gross - off - cost };
}

/**
 * Чеки текущей смены: всё с момента последнего закрытия. Пока смену ещё ни

/** Итог текущей смены: цифры, разбивка по кассирам и что именно продано. */
function shiftSummary() {
  const list = shift();
  const byWho = new Map();
  const items = new Map();
  let revenue = 0, cost = 0, off = 0, units = 0, sales = 0, salesSum = 0, returns = 0, refunds = 0;
  for (const c of list) {
    revenue += c.total; cost += c.cost; off += c.off;
    const r = byWho.get(c.by) ?? { name: c.by, n: 0, sum: 0, ret: 0 };
    r.sum += c.total;
    if (isReturn(c)) { r.ret += 1; returns += 1; refunds -= c.total; }
    else { r.n += 1; sales += 1; salesSum += c.total; }
    byWho.set(c.by, r);
    for (const l of c.lines) {
      units += l.qty;
      items.set(l.name, (items.get(l.name) ?? 0) + l.qty);
    }
  }
  return {
    from: data.shiftOpen?.at ?? data.shiftStart ?? list[0]?.at ?? Date.now(),
    openedBy: data.shiftOpen?.by ?? null,
    checks: sales, units, revenue, cost, profit: revenue - cost, off,
    returns, refunds,
    received: data.intakes.filter((i) => i.kind !== 'fix' && i.kind !== 'inv' && i.at >= (data.shiftStart ?? Date.now() - 12 * 3600e3))
      .reduce((a, i) => a + i.qty, 0),
    avg: sales ? Math.round(salesSum / sales) : 0,
    byWho: [...byWho.values()].sort((a, b) => b.sum - a.sum),
    items: [...items].map(([name, qty]) => ({ name, qty })).filter((i) => i.qty > 0).sort((a, b) => b.qty - a.qty),
  };
}

/* ------------------------------------------------------------- сканер */

/**
 * Пикалка подключена к ноутбуку и работает как клавиатура: печатает цифры
 * кода и жмёт Enter. Поэтому слушаем весь документ, а не поле ввода —
 * кассиру не надо никуда целиться мышкой, он просто пикает.
 *
 * Отличаем пистолет от человека по скорости: между символами у него
 * миллисекунды. Если курсор стоит в поле ввода, не мешаем печатать руками.
 */
let buf = '', lastKey = 0;

document.addEventListener('keydown', (event) => {
  const el = document.activeElement;
  const typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
  if (typing && el.id !== 'code-field') return;

  const now = Date.now();
  // Порог щедрый: проводной пистолет печатает за миллисекунды, но у
  // Bluetooth бывают заминки, и жёсткие сто миллисекунд рвали бы код
  // посередине. Человеку это не мешает: при наборе руками курсор стоит
  // в поле ввода, и сюда мы не доходим.
  if (now - lastKey > 300) buf = '';
  lastKey = now;

  // Часть пистолетов настроена слать Tab вместо Enter — принимаем оба.
  if (event.key === 'Enter' || event.key === 'Tab') {
    if (buf.length >= 6) {
      event.preventDefault();
      const code = buf;
      probe = { code, at: Date.now(), enter: true, chars: code.length };
      buf = '';
      onScan(code);
      if (tab === 'more') render();
    } else if (buf.length) {
      // Пришло мало символов: обычно это раскладка или настройка пистолета.
      probe = { code: buf, at: Date.now(), enter: true, chars: buf.length };
      if (tab === 'more') render();
    }
    buf = '';
    return;
  }
  if (event.key.length === 1) {
    buf += event.key;
    probe = { code: buf, at: Date.now(), enter: false, chars: buf.length };
  }
});

function onScan(code) {
  lastScan = code;

  const g = byCode(code);
  const soldDay = (x) => new Date(x.at).toLocaleDateString('ru-RU');

  if (tab === 'intake') {
    if (needName()) return;
    if (data.sold[code]) { flash(`Коробка ${code} уже продана ${soldDay(data.sold[code])}`); return; }
    // Штучный товар: знакомый код значит, что эту коробку уже принимали.
    if (g && isSerial(g)) { flash(`Коробка ${code} уже принята: ${g.name}`); return; }
    if (g) { sheet = { k: 'take', id: g.id }; render(); }
    else {
      // Незнакомый код у телефона почти всегда значит не новый товар,
      // а ещё одну трубку той же модели. Поэтому сначала предлагаем
      // выбрать из заведённого, а не заполнять карточку заново.
      pick = '';
      sheet = { k: 'newcode', code };
      render();
    }
    return;
  }

  if (needName() || needOpen()) return;

  if (data.sold[code]) { flash(`Эта коробка уже продана ${soldDay(data.sold[code])}`); return; }
  if (!g) {
    flash(`Код ${code} не найден${owner() ? '. Заведите товар в «Приёме»' : '. Позовите владельца'}`);
    return;
  }
  if (isSerial(g) && check.some((l) => l.id === g.id && l.codes.includes(code))) {
    flash('Эта коробка уже в чеке');
    return;
  }
  if (g.stock <= 0) { flash(`${g.name}: на остатке ноль`); return; }

  if (!addLine(g.id, code)) return;
  settle = true;
  render();
}

/**
 * Прибавить товар в чек.
 *
 * Код коробки запоминается в строке: у телефонов он свой на каждой
 * трубке, и после продажи по нему видно, какая именно ушла. Прибавить
 * без кода тоже можно — руками из списка.
 */
function addLine(id, code) {
  const g = good(id);
  const line = check.find((l) => l.id === id);
  // Больше, чем лежит на остатке, в чек не набрать: нельзя продать то,
  // чего нет, сколько бы раз ни пикнули.
  if ((line?.qty ?? 0) >= g.stock) {
    flash(`${g.name}: на остатке ${g.stock} шт — больше в чек не добавить`);
    return false;
  }
  if (line) {
    line.qty += 1;
    if (code && !line.codes.includes(code)) line.codes.push(code);
  } else {
    check.push({ id, qty: 1, off: 0, codes: code ? [code] : [] });
  }
  return true;
}

/**
 * Ходовое: то, что брали чаще всего за три недели. Нет в наличии — в конец,
 * а пока продаж нет, наверху последнее принятое.
 */
function popular(n = 6) {
  const since = Date.now() - 21 * 86400e3;
  const sold = new Map();
  for (const c of data.checks) {
    if (c.at < since) continue;
    for (const l of c.lines) sold.set(l.name, (sold.get(l.name) ?? 0) + l.qty);
  }
  return data.goods
    .map((g, i) => ({ g, i, q: sold.get(g.name) ?? 0 }))
    .sort((a, b) => (b.g.stock > 0) - (a.g.stock > 0) || b.q - a.q || (b.g.at ?? 0) - (a.g.at ?? 0) || a.i - b.i)
    .slice(0, n)
    .map((x) => x.g);
}

/** Поиск в списке инвентаризации. */
let invSearch = '';

/**
 * Расхождения начатой инвентаризации.
 *
 * Разница считается от остатка на момент пересчёта (base), а не от
 * нынешнего: продажи в магазине идут и во время подсчёта, и считать
 * недостачей то, что просто продали, нельзя.
 */
function invDiffs() {
  const d = data.invDraft;
  if (!d) return [];
  return Object.entries(d.counts)
    .map(([id, c]) => ({ g: good(id), n: c.n, base: c.base }))
    .filter((x) => x.g && x.n !== x.base)
    .map((x) => ({ ...x, diff: x.n - x.base }));
}
const invLines = (diffs) => diffs.map(({ g, n, base, diff }) => ({ id: g.id, name: g.name, was: base, now: n, diff, cost: g.cost }));
const signed_ = (n) => (n > 0 ? '+' : '') + n;

    </div>
    <div class="search" style="margin-top:12px">
      ${svg('scan', 18)}
      <input id="inv-q" value="${esc(invSearch)}" placeholder="Название или код" autocomplete="off">
      ${invSearch ? `<button class="plain" id="inv-q-clear" type="button" aria-label="Очистить">${svg('cross', 16)}</button>` : ''}
    </div>
    <div class="rows">
      ${list.length === 0 ? '<p class="q" style="padding:12px 0">Ничего не нашлось.</p>' : list.map((g) => {
        const c = d.counts[g.id];
        return `<div class="row">
          <div class="grow"><div class="t">${esc(g.name)}</div>

function sheetInv(rec, mode) {
  const lines = rec.lines;
  const value = lines.reduce((s, l) => s + l.diff * l.cost, 0);
  const lack = lines.filter((l) => l.diff < 0).reduce((s, l) => s + l.diff * l.cost, 0);
  const extra = lines.filter((l) => l.diff > 0).reduce((s, l) => s + l.diff * l.cost, 0);
  return `
    <h3>${mode === 'review' ? 'Итог инвентаризации' : 'Инвентаризация'}</h3>
    ${mode === 'view' ? `<p class="q">${stamp(rec.at)}, провёл(а) ${esc(rec.by)}. Посчитано товаров: ${rec.counted}.</p>` : `<p class="q">Посчитано товаров: ${rec.counted}.</p>`}

      <div class="figures" style="margin-top:12px">
        <div class="figure"><b style="color:var(--alarm)">${som(lack)}</b><span>недостача по закупу</span></div>
        <div class="figure"><b style="color:var(--money)">${som(extra)}</b><span>излишек по закупу</span></div>

/** За какой срок показывать, кто сколько продал. */
let repPeriod = 'shift';
const PERIODS = [['shift', 'Смена'], ['today', 'Сегодня'], ['7', '7 дней'], ['30', '30 дней'], ['all', 'Всё время']];

function periodChecks(p) {
  const day = new Date(); day.setHours(0, 0, 0, 0);
  const from = day.getTime();
  if (p === 'shift') return shift();
  if (p === 'today') return data.checks.filter((c) => c.at >= from);
  if (p === '7') return data.checks.filter((c) => c.at >= from - 6 * 86400e3);
  if (p === '30') return data.checks.filter((c) => c.at >= from - 29 * 86400e3);
  return data.checks;
}

/** Кто сколько продал: чеки, штуки и выручка по каждому человеку за выбранный срок. */
function whoSold() {
  const people = new Map();
  for (const c of periodChecks(repPeriod)) {
    const r = people.get(c.by) ?? { name: c.by, n: 0, ret: 0, units: 0, sum: 0, profit: 0 };
    if (isReturn(c)) r.ret += 1; else r.n += 1;
    r.units += c.lines.reduce((a, l) => a + l.qty, 0);
    r.sum += c.total;
    r.profit += c.total - c.cost;
    people.set(c.by, r);
  }
  const rows = [...people.values()].sort((a, b) => b.sum - a.sum);
  return `
    <h2>Кто сколько продал</h2>
    <div class="chipsrow" style="margin-bottom:12px">
      ${PERIODS.map(([id, text]) => `<button class="chipx" type="button" data-period="${id}" aria-pressed="${repPeriod === id}">${text}</button>`).join('')}
    </div>
    ${rows.length === 0 ? '<p class="q">За этот срок продаж не было.</p>' : `
      <div class="rows">${rows.map((r) => `
        <div class="row"><div class="grow"><div class="t">${esc(r.name)}</div>
          <div class="q2">${r.n} ${plural(r.n, 'чек', 'чека', 'чеков')}, ${r.units} шт${r.ret ? `, возвратов: ${r.ret}` : ''}</div></div>
          <div style="text-align:right"><div class="amt n">${som(r.sum)}</div>
            ${owner() ? `<div class="q2 n" style="color:var(--money)">${som(r.profit)}</div>` : ''}</div></div>`).join('')}</div>`}`;
}

/**
 * Что заканчивается.
 *
 * Не просто «мало штук», а на сколько дней хватит при нынешнем спросе:
 * четыре чехла, которые берут по два в день, кончатся раньше, чем один
 * телефон, который берут раз в месяц.
 */
function runningOut() {
  const since = Date.now() - 21 * 24 * 3600e3;
  const sold = new Map();
  for (const c of data.checks) {
    if (c.at < since) continue;
    for (const l of c.lines) sold.set(l.name, (sold.get(l.name) ?? 0) + l.qty);
  }

  const rows = data.goods
    .map((g) => {
      const perDay = (sold.get(g.name) ?? 0) / 21;
      const days = perDay > 0 ? Math.floor(g.stock / perDay) : null;
      return { g, perDay, days };
    })
    .filter((r) => r.g.stock <= 3 || (r.days !== null && r.days <= 10))
    .sort((a, b) => (a.days ?? 999) - (b.days ?? 999))
    .slice(0, 8);

  if (rows.length === 0) {
    return '<h2>Что заканчивается</h2><p class="q">Всего хватает: ни одна позиция не кончается в ближайшие десять дней.</p>';
  }

  return `
    <h2>Что заканчивается</h2>
    <p class="q">Считается по спросу за три недели.</p>
    <div class="rows">
      ${rows.map(({ g, perDay, days }) => `
        <div class="row">
          <div class="grow">
            <div class="t">${esc(g.name)}</div>
            <div class="q2 n">берут ${perDay >= 1 ? perDay.toFixed(1) : perDay > 0 ? perDay.toFixed(2) : '0'} шт в день</div>
          </div>
          <div style="text-align:right">
            <div class="amt n" style="color:${g.stock <= 2 ? 'var(--alarm)' : 'var(--ink)'}">${g.stock} шт</div>
            <div class="q2 n">${days === null ? 'спроса нет' : days === 0 ? 'кончился' : `на ${days} ${plural(days, 'день', 'дня', 'дней')}`}</div>
          </div>
        </div>`).join('')}
    </div>`;
}

/* --------------------------------------------------------------- листы */

function sheetOff(id) {
  const l = check.find((x) => x.id === id);
  const g = good(id);
  const sum = g.price * l.qty;
  const cap = capped() ? Math.min(data.limit * l.qty, sum) : sum;

  return `
    <h3>Скидка на ${esc(g.name)}</h3>
    <p class="q">Цена ${som(sum)}${l.qty > 1 ? ` за ${l.qty} шт` : ''}. Скидка задаётся в сомах, а не в процентах.</p>

    <div class="chipsrow" style="margin-bottom:12px">
      ${QUICK_OFF.filter((v) => v <= cap).map((v) => `
        <button class="chipx" type="button" data-setoff="${id}" data-v="${v}" aria-pressed="${l.off === v}">−${som(v)}</button>`).join('')}
      ${l.off ? `<button class="chipx" type="button" data-setoff="${id}" data-v="0">убрать скидку</button>` : ''}
    </div>

    <div class="pair">
      <label class="fld"><span>Скинуть, сом</span>
        <input id="off-value" type="number" inputmode="numeric" value="${l.off}" min="0" max="${cap}"></label>
      <label class="fld"><span>Отдать за, сом</span>
        <input id="off-final" type="number" inputmode="numeric" value="${sum - l.off}" min="${sum - cap}" max="${sum}"></label>
    </div>
    <p class="q2">Можно задать любое из двух: впишете «отдать за 300» — скидка посчитается сама.</p>

    ${capped()
      ? `<p class="q2">Ваш предел — ${som(data.limit)} с позиции${l.qty > 1 ? `, то есть ${som(cap)} на ${l.qty} шт` : ''}.</p>`
      : '<p class="q2">Скидка без предела: главное, чтобы цена не ушла ниже нуля.</p>'}

    <button class="btn" data-offsave="${id}" type="button">Применить</button>
    <button class="btn line" data-shut="1" type="button">Отмена</button>`;
}

/**
 * Незнакомый код при приёме.
 *
 * Главная кнопка здесь не «завести товар», а список уже заведённого:
 * пришла вторая такая же трубка — одно нажатие, код прибавился к
 * модели, остаток вырос. Заводить карточку заново нужно только на
 * действительно новую модель, и эта дорога ниже.
 */
function sheetNewCode(code) {
  const q = pick.trim().toLowerCase();
  const list = data.goods
    .filter((g) => !q || g.name.toLowerCase().includes(q))
    // Недавно принятое сверху: обычно приходит коробка за коробкой.
    .sort((a, b) => (b.at ?? 0) - (a.at ?? 0))
    .slice(0, 8);

  return `
    <h3>Новая коробка</h3>
    <p class="q">Код <b class="n">${esc(code ?? '')}</b> ещё не встречался. У телефонов он свой на каждой коробке — выберите, что это за товар.</p>

    <div class="search">
      ${svg('scan', 18)}
      <input id="pick-q" value="${esc(pick)}" placeholder="Название товара" autocomplete="off" autofocus>
      ${pick ? `<button class="plain" id="pick-clear" type="button" aria-label="Очистить">${svg('cross', 16)}</button>` : ''}
    </div>

    <div class="rows">
      ${list.length === 0 ? '<p class="q" style="padding:12px 0">Ничего не нашлось.</p>' : list.map((g) => `
        <div class="row">
          <button class="plain grow" type="button" data-attach="${g.id}">
            <div class="t">${esc(g.name)}</div>
            <div class="q2 n">на остатке ${g.stock} шт${owner() ? `, закуп ${som(g.cost)}` : ''}</div>
          </button>
          <div class="amt n">${som(g.price)}</div>
        </div>`).join('')}
    </div>

    ${data.goods.length > 8 ? '<p class="q2">Показаны восемь последних — остальное найдётся по названию.</p>' : ''}

    <div class="stick">
      <button class="btn" id="ng-open" type="button">${svg('plus')}Это новый товар</button>
      <button class="btn line" data-shut="1" type="button">Отмена</button>
    </div>`;
}

/**
 * Привычный набор, а за ним — то, что магазин завёл сам.
 *
 * Порядок держим: память, перетасованная по частоте, читается хуже, чем
 * выстроенная по возрастанию — глаз ищет не самое частое, а своё.
 */
function hints(field, standard) {
  const used = data.goods.map((g) => g[field]).filter(Boolean);
  const extra = [...new Set(used)].filter((v) => !standard.includes(v));
  return [...standard, ...extra].slice(0, 9);
}

const RAMS = ['3', '4', '6', '8', '12', '16'];
const MEMS = ['64 ГБ', '128 ГБ', '256 ГБ', '512 ГБ', '1 ТБ'];
const COLORS = ['чёрный', 'белый', 'синий', 'зелёный', 'серый', 'золотой'];

/**
 * Поле с кнопками-подсказками и строкой ввода.
 *
 * Кнопки — на то, что приходит чаще всего: одно нажатие вместо
 * набора. Строка рядом — на всё остальное, потому что завтра привезут
 * 24 ГБ или цвет «полуночный», и упереться в чужой список нельзя.
 * Нажатая повторно кнопка снимает выбор.
 */
function chips(field, values, chosen, подпись, подсказка) {
  return `
    <p class="q2" style="margin:0 0 6px">${подпись}</p>
    <div class="cuts" style="flex-wrap:wrap;gap:6px;margin-bottom:8px">
      ${values.map((v) => `
        <button class="cut" type="button" data-ngset="${field}" data-ngval="${esc(v)}"
                aria-pressed="${chosen === v}">${esc(v)}</button>`).join('')}
    </div>
    <input id="ng-${field}" class="plainfld" value="${esc(chosen)}" placeholder="${подсказка}"
           style="margin-bottom:12px" autocomplete="off">`;
}

/**
 * Карточка нового товара.
 *
 * Название разложено на модель, память и цвет: в магазине телефонов
 * это три разных вопроса, и набирать «iPhone 15 256 ГБ чёрный» одной

 */
function sheetNewGood() {

  return `
    <h3>Новый товар</h3>

      ? `<p class="q">Код <b class="n">${esc(ng.code)}</b> будет привязан к этому товару. Следующую такую же коробку достаточно будет пикнуть и выбрать из списка.</p>`
      : '<p class="q">Заводим товар руками, без пикалки. Коды прибавятся сами, когда коробки начнут приходить.</p>'}

    <label class="fld"><span>Модель</span>

    ${ng.bad === 'model' ? '<p class="q2" style="color:var(--red);margin:-6px 0 10px">Без модели не обойтись.</p>' : ''}

    ${chips('ram', hints('ram', RAMS), ng.ram, 'Оперативная память, ГБ', 'например, 24')}
    ${chips('mem', hints('mem', MEMS), ng.mem, 'Память', 'например, 2 ТБ')}
